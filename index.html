<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수원 화성 방어전 - 7x5 로그라이크 고도화 에디션</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; touch-action: manipulation; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 600px; margin: 0 auto; background: #1a1a1a; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        /* 상단 UI */
        #top-ui { height: 55px; background: rgba(34, 34, 34, 0.9); border-bottom: 3px solid #333; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; font-size: 13px; font-weight: bold; z-index: 5; }
        .ui-stat { display: flex; align-items: center; gap: 4px; }
        .gold-text { color: #ffd700; }
        .elec-text { color: #00ffff; }
        .wave-text { color: #ff4d4d; }
        #canvas-container { flex: 1; position: relative; background: #141414; }
        canvas { width: 100%; height: 100%; display: block; z-index: 2; position: relative; }
        
        /* 배경 레이어 가시화 */
        .bg-underlay { position: absolute; top:0; left:0; width:100%; height:100%; opacity: 0.8; pointer-events: none; z-index: 1; background-size: cover; background-position: center; }

        /* 하단 UI */
        #bottom-ui { height: 95px; background: #222; border-top: 3px solid #333; display: flex; justify-content: space-around; align-items: center; padding: 8px; gap: 6px; z-index: 5; }
        .build-btn { flex: 1; height: 100%; background: #2b2b2b; border: 2px solid #444; border-radius: 8px; color: #fff; font-weight: bold; font-size: 11px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; transition: all 0.1s; }
        .build-btn.active { border-color: #00ffff; background: #1e2e2e; transform: scale(1.03); }
        .cost-tag { font-size: 9px; color: #ffd700; }
        
        /* 모달 시스템 */
        #upgrade-modal { display: none; position: absolute; bottom: 110px; left: 5%; width: 90%; background: rgba(20, 20, 20, 0.98); border: 2px solid #ff4141; border-radius: 10px; padding: 15px; z-index: 10; box-shadow: 0 0 15px rgba(255,65,65,0.4); }
        .modal-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #ff4141; display: flex; justify-content: space-between; }
        .modal-close { cursor: pointer; color: #ff4d4d; padding: 0 5px; }
        .modal-info { font-size: 12px; margin-bottom: 12px; line-height: 1.6; color: #ddd; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: #292929; padding: 8px; border-radius: 5px; margin-bottom: 10px; border-left: 3px solid #ff4141; font-size: 11px; }
        .modal-btn { width: 100%; padding: 10px; background: #ff4141; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 5px; }
        .modal-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        
        /* 기술 개발 연구 버튼 스타일 */
        .tech-btn { background: #0088cc !important; color: white !important; margin-top: 6px; }
        .tech-btn:disabled { background: #445560 !important; color: #888 !important; }

        .evo-container { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; border-top: 1px dashed #444; padding-top: 10px; }
        .evo-btn { padding: 6px 4px; border: 1px solid #555; background: #1f1f1f; color: #fff; font-size: 9px; border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center; }

        /* 로그라이크 보상 UI */
        #rogue-modal { display: none; position: absolute; top: 20%; left: 5%; width: 90%; background: rgba(15, 15, 25, 0.95); border: 3px solid #3b82f6; border-radius: 12px; padding: 20px; z-index: 50; text-align: center; box-shadow: 0 0 25px rgba(59,130,246,0.6); }
        .rogue-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .card-btn { background: #1e293b; border: 2px solid #475569; padding: 12px; border-radius: 8px; color: white; text-align: left; cursor: pointer; transition: 0.2s; }
        .card-btn:hover { background: #334155; border-color: #3b82f6; }
        .card-title { font-weight: bold; font-size: 14px; color: #60a5fa; margin-bottom: 3px; }
        .card-desc { font-size: 11px; color: #cbd5e1; }

        /* 게임오버 */
        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #restart-btn { padding: 12px 35px; font-size: 16px; background: #ff4d4d; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #sound-notice { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 15px; font-size: 10px; color: #ffd700; z-index: 4; pointer-events: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="sound-notice">탭하면 게임 오디오가 주입됩니다 🔊</div>
    <div id="top-ui">
        <div class="ui-stat">💰 <span id="gold-val" class="gold-text">350</span></div>
        <div class="ui-stat">⚡ <span id="elec-val" class="elec-text">0</span></div>
        <div class="ui-stat">☠️ <span id="wave-val" class="wave-text">WAVE 1</span></div>
        <div id="timer-val">00:00</div>
    </div>

    <div id="canvas-container">
        <div id="bg-bridge" class="bg-underlay"></div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="upgrade-modal">
            <div class="modal-title"><span id="m-title">건물 정보</span><span class="modal-close" id="m-close">✕</span></div>
            <div class="modal-info" id="m-info">설명</div>
            <div class="status-grid" id="m-status">내용</div>
            <button class="modal-btn" id="m-upgrade-btn">업그레이드</button>
            
            <button class="modal-btn tech-btn" id="m-tech-dmg-btn" style="display:none;">🧬 화약 정밀 개량 (⚡5)</button>
            <button class="modal-btn tech-btn" id="m-tech-hp-btn" style="display:none;">🛡️ 성곽 철골 보강 (⚡8)</button>
            
            <div class="evo-container" id="m-evo-box">
                <div class="evo-btn" id="evo-multi" style="border-color:#ffd700; color:#ffd700;">🏹신기전(5중타겟)<br>💰250</div>
                <div class="evo-btn" id="evo-fire" style="border-color:#ff4d4d; color:#ff4d4d;">🔥화차(범위스플)<br>💰250</div>
                <div class="evo-btn" id="evo-lightning" style="border-color:#a855f7; color:#a855f7;">⚡번개포(5회연쇄)<br>💰250</div>
            </div>
        </div>

        <div id="rogue-modal">
            <h2 style="color: #60a5fa; font-size: 17px;">🎁 화성 방어 기지 전술 선택</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">조선 수비대장님, 보급 전술 카드를 선택하십시오.</p>
            <div class="rogue-grid" id="rogue-cards-container"></div>
        </div>
    </div>

    <div id="bottom-ui">
        <button class="build-btn" id="btn-generator"><div>⚡ 군량고</div><div class="cost-tag">💰60</div></button>
        <button class="build-btn" id="btn-turret"><div>🏹 기본 포루</div><div class="cost-tag">💰70</div></button>
        <button class="build-btn" id="btn-slow"><div>❄️ 얼음덫</div><div class="cost-tag" style="color:#00ffff">💰100 ⚡1</div></button>
        <button class="build-btn" id="btn-amp"><div>⚙️ 기치창(증폭)</div><div class="cost-tag" style="color:#ff00ff">💰160 ⚡3</div></button>
    </div>

    <div id="game-over-screen">
        <h1 style="color:#ff4d4d; font-size:32px;">🏰 성문 함락</h1>
        <p id="go-desc" style="color: #aaa; font-size: 14px;"></p>
        <button id="restart-btn">다시 도전</button>
    </div>
</div>

<script>
    const gameImages = {
        zombie_normal: new Image(), generator: new Image(), turret: new Image(), slow: new Image(), amp: new Image(), gate: new Image(),
        bg1: new Image(), bg2: new Image(), bg3: new Image(), bg4: new Image()
    };
    gameImages.zombie_normal.src = "zombie.png";
    gameImages.generator.src = "generator.png";
    gameImages.turret.src = "turret_base.png";
    gameImages.slow.src = "turret_slow.png";
    gameImages.amp.src = "turret_amp.png";
    gameImages.gate.src = "castle_gate.png";
    
    gameImages.bg1.src = "background_wall1.png";
    gameImages.bg2.src = "background_wall2.png";
    gameImages.bg3.src = "background_wall3.png";
    gameImages.bg4.src = "background_wall4.png";

    const ZOMBIE_SPRITE_CONF = { sheetWidth: 320, sheetHeight: 30, totalFrames: 7 };

    let audioCtx = null; let bgmInterval = null;
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startBGM();
        if(document.getElementById('sound-notice')) document.getElementById('sound-notice').style.display = 'none';
    }
    const bgmMelody = [
        {f: 261, d: 0.12}, {f: 329, d: 0.12}, {f: 392, d: 0.12}, {f: 523, d: 0.2},
        {f: 0, d: 0.05}, {f: 494, d: 0.12}, {f: 392, d: 0.12}, {f: 329, d: 0.12}
    ];
    let bgmIndex = 0;
    function startBGM() {
        if (!audioCtx) return;
        function playNextNote() {
            if (gameState.gameOver) return;
            let note = bgmMelody[bgmIndex];
            if (note.f > 0) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + note.d);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + note.d);
            }
            bgmIndex = (bgmIndex + 1) % bgmMelody.length;
            bgmInterval = setTimeout(playNextNote, note.d * 1100);
        }
        playNextNote();
    }
    function playSoundFX(type) {
        if (!audioCtx) return; let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        if (type === 'shoot') {
            osc.type = 'square'; osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.07);
            gain.gain.setValueAtTime(0.02, now); gain.gain.linearRampToValueAtTime(0, now + 0.07);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.07);
        } else if (type === 'lightning') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(300, now + 0.04);
            gain.gain.setValueAtTime(0.015, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.08);
        } else if (type === 'coin') {
            osc.type = 'square'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1200, now + 0.06);
            gain.gain.setValueAtTime(0.02, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.15);
        } else if (type === 'gameover') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(220, now); osc.frequency.linearRampToValueAtTime(40, now + 0.7);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.7);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.7);
        }
    }

    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let gameState = { 
        gold: 350, electricity: 0, wave: 1, time: 0, gameOver: false, 
        waveZombiesLeft: 12, waveTotalSpawned: 0, waveMaxSpawn: 12, lastSpawnTime: 0,
        waveActive: false, startDelay: 5, choiceActive: false
    };
    
    const GRID_ROWS = 5; const GRID_COLS = 7;
    let cellWidth = 0; let cellHeight = 0; let gridStartY = 0; let gridHeight = 0;
    
    // 성문 구조체 객체에 레벨별 기본 골드 지급 연동을 위한 속성 보강 (level * 2의 수치 배정)
    let gate = { name: "SUWON", x: 0, y: 0, width: 155, height: 28, hp: 2000, maxHp: 2000, level: 1, regen: 6, upgradeCost: 150 };

    function updateGridDimensions() {
        gridStartY = canvas.height * 0.35; 
        gridHeight = canvas.height * 0.50;
        cellWidth = canvas.width / GRID_COLS; 
        cellHeight = gridHeight / GRID_ROWS;
        
        gate.x = canvas.width / 2 - gate.width / 2; 
        gate.y = gridStartY + gridHeight + 6;
    }
    function resizeCanvas() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; updateGridDimensions(); }
    window.addEventListener('resize', resizeCanvas);

    let selectedObject = null;
    let buildings = []; let zombies = []; let bullets = []; let particles = []; let textPopups = []; let chainLines = [];
    let currentBuildMode = 'none'; 
    let globalBuff = { rangeBonus: 0, maxAmpLevel: 0, dmgMultiplier: 1.0, critChance: 0.05 };

    const goldVal = document.getElementById('gold-val'); const elecVal = document.getElementById('elec-val');
    const waveVal = document.getElementById('wave-val'); const timerVal = document.getElementById('timer-val');
    const upgradeModal = document.getElementById('upgrade-modal');
    const rogueModal = document.getElementById('rogue-modal');

    window.addEventListener('click', initAudio); window.addEventListener('touchstart', initAudio);

    const modes = ['generator', 'turret', 'slow', 'amp'];
    modes.forEach(mode => {
        document.getElementById(`btn-${mode}`).addEventListener('click', (e) => { 
            e.stopPropagation(); 
            if(gameState.choiceActive) return;
            setBuildMode(currentBuildMode === mode ? 'none' : mode); 
        });
    });

    function setBuildMode(mode) {
        currentBuildMode = mode;
        modes.forEach(m => document.getElementById(`btn-${m}`).classList.toggle('active', currentBuildMode === m));
    }

    canvas.addEventListener('click', (e) => {
        if(gameState.choiceActive) return;
        const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top;
        
        if (x >= gate.x && x <= gate.x + gate.width && y >= gate.y && y <= gate.y + gate.height) {
            selectedObject = { type: 'gate' }; showGateUpgradeModal(); return;
        }
        if (y >= gridStartY && y <= gridStartY + gridHeight) {
            const col = Math.floor(x / cellWidth); const row = Math.floor((y - gridStartY) / cellHeight);
            if (col >= 0 && col < GRID_COLS && row >= 0 && row < GRID_ROWS) handleGridClick(row, col);
        } else { hideAllModals(); selectedObject = null; }
    });

    function hideAllModals() {
        upgradeModal.style.display = 'none';
        document.getElementById('m-tech-dmg-btn').style.display = 'none';
        document.getElementById('m-tech-hp-btn').style.display = 'none';
    }

    function handleGridClick(row, col) {
        const existing = buildings.find(b => b.row === row && b.col === col);
        if (currentBuildMode !== 'none') {
            if (existing) return;
            let cost = 0; let elecCost = 0;
            if (currentBuildMode === 'generator') cost = 60;
            else if (currentBuildMode === 'turret') cost = 70;
            else if (currentBuildMode === 'slow') { cost = 100; elecCost = 1; }
            else if (currentBuildMode === 'amp') { cost = 160; elecCost = 3; }

            if (gameState.gold >= cost && gameState.electricity >= elecCost) {
                gameState.gold -= cost; gameState.electricity -= elecCost;
                buildings.push({ row, col, type: currentBuildMode, level: 1, subType: 'none', lastShot: 0, lastGenTime: Date.now(), isBuffed: false, buffMultiplier: 1.0 });
                createParticle(col * cellWidth + cellWidth/2, gridStartY + row * cellHeight + cellHeight/2, '#ffffff', 12);
                setBuildMode('none'); recalculateBuffs(); updateUI();
            }
        } else if (existing) { 
            selectedObject = existing; 
            showUpgradeModal(existing); 
        }
    }

    function recalculateBuffs() {
        let maxAmp = 0;
        buildings.forEach(b => { 
            if (b.type === 'amp') { if (b.level > maxAmp) maxAmp = b.level; } 
            b.isBuffed = false;
            b.buffMultiplier = 1.0;
        });
        
        globalBuff.maxAmpLevel = maxAmp;
        globalBuff.rangeBonus = (maxAmp * 12);

        buildings.forEach(amp => {
            if (amp.type === 'amp') {
                let ampPower = 1.0 + (amp.level * 0.15);
                buildings.forEach(target => {
                    if (target.type !== 'generator' && target.type !== 'amp') {
                        if (Math.abs(amp.row - target.row) <= 1 && Math.abs(amp.col - target.col) <= 1) {
                            target.isBuffed = true;
                            if (ampPower > target.buffMultiplier) {
                                target.buffMultiplier = ampPower;
                            }
                        }
                    }
                });
            }
        });

        if (upgradeModal.style.display === 'block' && selectedObject && selectedObject.type !== 'gate') {
            showUpgradeModal(selectedObject);
        }
    }

    function showGateUpgradeModal() {
        upgradeModal.style.display = 'block'; document.getElementById('m-evo-box').style.display = 'none';
        const upBtn = document.getElementById('m-upgrade-btn'); upBtn.style.display = 'block';
        
        const dmgTechBtn = document.getElementById('m-tech-dmg-btn');
        const hpTechBtn = document.getElementById('m-tech-hp-btn');
        dmgTechBtn.style.display = 'block'; hpTechBtn.style.display = 'block';

        document.getElementById('m-title').innerText = `🧱 화성 성문 장벽 (Lv.${gate.level})`;
        document.getElementById('m-info').innerHTML = "성곽 증축 및 ⚡ 전력을 소모하여 조선 과학기술 부대의 영구 군사 혜택을 연구합니다.";
        document.getElementById('m-status').innerHTML = `<div>최대 방어: ${gate.maxHp}</div><div>초당 복구: +${gate.regen}</div><div style="color:#ffd700; grid-column: span 2;">성문 고유 자금 보조: +💰${gate.level * 2}/초</div>`;
        
        upBtn.innerText = `성곽 증축 (💰${gate.upgradeCost})`; upBtn.disabled = gameState.gold < gate.upgradeCost;
        upBtn.onclick = () => {
            if (gameState.gold >= gate.upgradeCost) {
                gameState.gold -= gate.upgradeCost; gate.level++; gate.maxHp += 1000; gate.hp = gate.maxHp; gate.regen += 4;
                gate.upgradeCost = Math.floor(gate.upgradeCost * 1.6);
                createParticle(gate.x + gate.width/2, gate.y + gate.height/2, '#ffd700', 20);
                hideAllModals(); selectedObject = null; updateUI();
            }
        };

        dmgTechBtn.disabled = gameState.electricity < 5;
        dmgTechBtn.onclick = () => {
            if(gameState.electricity >= 5) {
                gameState.electricity -= 5; globalBuff.critChance += 0.10;
                createPopupText(canvas.width/2, gridStartY, "⚡ 기술개발: 치명타율 +10%", "#00ffff", 14);
                showGateUpgradeModal(); updateUI();
            }
        };

        hpTechBtn.disabled = gameState.electricity < 8;
        hpTechBtn.onclick = () => {
            if(gameState.electricity >= 8) {
                gameState.electricity -= 8; gate.maxHp += 1500; gate.hp = gate.maxHp;
                createPopupText(gate.x + gate.width/2, gate.y - 10, "⚡ 성벽 외곽 요새 철골 보강!", "#00ff00", 13);
                showGateUpgradeModal(); updateUI();
            }
        };
    }

    function showUpgradeModal(building) {
        upgradeModal.style.display = 'block';
        const evoBox = document.getElementById('m-evo-box'); const upBtn = document.getElementById('m-upgrade-btn');
        document.getElementById('m-tech-dmg-btn').style.display = 'none';
        document.getElementById('m-tech-hp-btn').style.display = 'none';
        evoBox.style.display = "none"; upBtn.style.display = "block"; upBtn.disabled = false;

        let costGold = Math.floor(50 * Math.pow(1.5, building.level));
        if (building.type === 'amp') costGold = Math.floor(130 * Math.pow(1.7, building.level));
        if (building.subType !== 'none') costGold = Math.floor(140 * Math.pow(1.6, building.level - 4));

        let typeLabel = "포루 시설";
        if(building.type==='generator') typeLabel="군량고";
        if(building.type==='slow') typeLabel="얼음덫";
        if(building.type==='amp') typeLabel="기치창(증폭)";
        if(building.subType==='multi') typeLabel="신기전 포루";
        if(building.subType==='fire') typeLabel="화차 포루";
        if(building.subType==='lightning') typeLabel="번개 폭포루";

        document.getElementById('m-title').innerText = `${typeLabel} (Lv.${building.level})`;
        
        let desc = ""; let statusHtml = "";
        let isLocked = (building.type !== 'amp' && building.level >= 7 && globalBuff.maxAmpLevel < 3);

        if (building.level >= 10) {
            upBtn.innerText = `최대 승급 완료 (Lv.10)`; upBtn.disabled = true;
        } else if (isLocked) {
            upBtn.innerText = `⚠️ 돌파 불가 (기치창 Lv.3 필요)`; upBtn.disabled = true;
        } else {
            upBtn.innerText = `승급 (💰${costGold})`;
            if (gameState.gold < costGold) upBtn.disabled = true;
        }

        if (building.type === 'generator') {
            let currentCooldown = Math.max(400, 2000 - (building.level - 1) * 200) / 1000;
            let nextCooldown = Math.max(400, 2000 - building.level * 200) / 1000;
            desc = "군량과 활력을 보급하는 요충지입니다. 승급 시 군비 생산 주기가 크게 단축됩니다.";
            statusHtml = `<div style="color:#ffd700;">생산 군비: +${building.level * 4}</div>
                         <div style="color:#00ffff;">생산 활력: ${building.level >= 3 ? `+${building.level - 2}` : '0'}</div>
                         <div style="grid-column: span 2; color:#a855f7; margin-top:4px;">생산 주기: ${currentCooldown}초 ➔ <span style="color:#00ff00;">${building.level >= 10 ? 'MAX' : nextCooldown + '초'}</span></div>`;
        } else if (building.type === 'amp') {
            desc = "주변 3x3 타일 내의 아군 포루들의 화력을 군호와 깃발로 고취하여 증폭시킵니다.";
            statusHtml = `<div style="grid-column: span 2; color:#ff4141; font-size:12px; text-align:center; padding:4px;">범위 내 화력 증폭: +${building.level * 15}%</div>`;
        } else if (building.type === 'slow') {
            let baseDmg = 4 + (building.level - 1) * 2; 
            let finalDmg = Math.floor(baseDmg * building.buffMultiplier * globalBuff.dmgMultiplier);
            statusHtml = `<div>동결피해: ${finalDmg}</div><div>포격사거리: ${160 + (building.level - 1) * 10 + globalBuff.rangeBonus}px</div>`;
        } else if (building.type === 'turret') {
            if (building.subType === 'none') {
                let baseDmg = 14 + (building.level - 1) * 8; 
                let finalDmg = Math.floor(baseDmg * building.buffMultiplier * globalBuff.dmgMultiplier);
                statusHtml = `<div>살상력: ${finalDmg}</div><div>포격사거리: ${240 + (building.level - 1) * 12 + globalBuff.rangeBonus}px</div>`;
                if (building.level >= 5) { upBtn.style.display = "none"; evoBox.style.display = "grid"; setupEvoEvents(building); }
            } else {
                let rangeBonus = (building.level - 5) * 12;
                if (building.subType === 'multi') {
                    statusHtml = `<div>신기전 화력: ${Math.floor((28 + (building.level - 5) * 10) * building.buffMultiplier * globalBuff.dmgMultiplier)}</div><div>동시 격추수: <span style="color:#ffd700;">5개체</span></div>`;
                } else if (building.subType === 'fire') {
                    statusHtml = `<div>화염 데미지: ${Math.floor((90 + (building.level - 5) * 30) * building.buffMultiplier * globalBuff.dmgMultiplier)}</div><div>특수 효과: <span style="color:#ff4d4d;">스플래쉬 방사</span></div>`;
                } else if (building.subType === 'lightning') {
                    statusHtml = `<div>연쇄 전격력: ${Math.floor((6 + (building.level - 5) * 2) * building.buffMultiplier * globalBuff.dmgMultiplier)}</div><div>최대 연쇄: <span style="color:#a855f7;">5회 연속 체인</span></div>`;
                }
            }
        }
        document.getElementById('m-info').innerHTML = desc; document.getElementById('m-status').innerHTML = statusHtml;
        
        upBtn.onclick = () => {
            if (gameState.gold >= costGold) {
                gameState.gold -= costGold; building.level++;
                if (building.type === 'generator' && building.level >= 3) gameState.electricity += 1;
                recalculateBuffs(); showUpgradeModal(building); updateUI();
            }
        };
    }
    document.getElementById('m-close').onclick = () => { hideAllModals(); selectedObject = null; };

    function setupEvoEvents(building) {
        ['multi', 'fire', 'lightning'].forEach(type => {
            document.getElementById(`evo-${type}`).onclick = () => {
                if (gameState.gold >= 250) {
                    gameState.gold -= 250; building.subType = type; building.level = 5;
                    createParticle(canvas.width/2, gridStartY, '#ffd700', 25);
                    recalculateBuffs(); showUpgradeModal(building); updateUI();
                }
            };
        });
    }

    function triggerRogueChoice() {
        gameState.choiceActive = true;
        hideAllModals();
        rogueModal.style.display = 'block';

        const pool = [
            { id: 'gate_heal', title: '🛠️ 성문 긴급 영소수리', desc: '화성 성문의 파손 부위를 고쳐 체력을 50% 즉시 회복합니다.' },
            { id: 'gate_max', title: '🧱 옹성 철갑 외벽 증축', desc: '성문의 한계 내구도를 영구히 +2,000 올리고 즉시 수리합니다.' },
            { id: 'gold_pack', title: '💰 조정의 특급 군비 지원', desc: '조정으로부터 특별 군사 지원 자금 300 골드를 즉시 양도받습니다.' },
            { id: 'dmg_all', title: '🔥 화약 무기 전면 개량', desc: '모든 공격용 포루의 살상력(데미지)을 영구적으로 +20% 증가시킵니다.' },
            { id: 'range_all', title: '📡 정조의 명 사거리 확대', desc: '모든 방어 포루의 사거리를 영구히 +20px 일괄 상향합니다.' }
        ];

        let shuffled = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
        const container = document.getElementById('rogue-cards-container');
        container.innerHTML = '';

        shuffled.forEach(card => {
            let btn = document.createElement('button');
            btn.className = 'card-btn';
            btn.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div>`;
            btn.onclick = () => {
                applyRogueEffect(card.id);
                rogueModal.style.display = 'none';
                gameState.choiceActive = false;
                startNextWave();
            };
            container.appendChild(btn);
        });
    }

    function applyRogueEffect(id) {
        if(id === 'gate_heal') {
            gate.hp = Math.min(gate.maxHp, gate.hp + gate.maxHp * 0.5);
            createPopupText(gate.x + gate.width/2, gate.y - 10, "+영소수리 50%", "#10b981", 14);
        } else if(id === 'gate_max') {
            gate.maxHp += 2000; gate.hp += 2000;
            createPopupText(gate.x + gate.width/2, gate.y - 10, "옹성 외벽 증축 완료!", "#3b82f6", 14);
        } else if(id === 'gold_pack') {
            gameState.gold += 300;
            playSoundFX('coin');
        } else if(id === 'dmg_all') {
            globalBuff.dmgMultiplier += 0.20;
            createPopupText(canvas.width/2, gridStartY + gridHeight/2, "🔥 전군 화력 +20%", "#ff4d4d", 15);
        } else if(id === 'range_all') {
            globalBuff.rangeBonus += 20;
            createPopupText(canvas.width/2, gridStartY + gridHeight/2, "📡 전군 사거리 +20px", "#60a5fa", 15);
        }
        recalculateBuffs();
        updateUI();
    }

    function createParticle(x, y, color, count) {
        for(let i=0; i<count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, radius: Math.random()*2.5+1, color, alpha: 1 });
    }
    function createPopupText(x, y, text, color, size) { textPopups.push({ x, y, text: text, color: color, alpha: 1, size: size, ySpeed: -0.8 }); }

    function spawnZombieHorde() {
        if (gameState.gameOver || !gameState.waveActive || gameState.waveTotalSpawned >= gameState.waveMaxSpawn || gameState.choiceActive) return;
        if (gameState.wave > 40) { gameState.gameOver = true; endGame(true); return; }

        let hpBase = 45 + Math.pow(gameState.wave, 1.48) * 17;
        let speedMultiplier = Math.min(2.0, 0.9 + (gameState.wave * 0.07));
        let hordeSize = Math.min(8, 3 + Math.floor(gameState.wave / 3));
        
        for (let k = 0; k < hordeSize; k++) {
            if (gameState.waveTotalSpawned >= gameState.waveMaxSpawn) break;
            gameState.waveTotalSpawned++;
            let spawnX = 20 + Math.random() * (canvas.width - 40); 
            let spawnY = -20 - (Math.random() * 50);
            
            if (gameState.wave % 5 === 0 && gameState.waveTotalSpawned === 1) {
                zombies.push({ x: canvas.width/2, y: -40, hp: hpBase*6, maxHp: hpBase*6, speed: 0.20 * speedMultiplier, type: 'boss', radius: 22, state: 'attack', lastAttack: 0, slowTimer: 0, animFrame: 0, animTimer: 0, maxFrames: 4, isDead: false });
            } else if (Math.random() > 0.7) {
                zombies.push({ x: spawnX, y: spawnY, hp: hpBase*0.5, maxHp: hpBase*0.5, speed: 1.1 * speedMultiplier, type: 'runner', radius: 9, state: 'attack', lastAttack: 0, slowTimer: 0, animFrame: 0, animTimer: 0, maxFrames: 4, isDead: false });
            } else {
                zombies.push({ x: spawnX, y: spawnY, hp: hpBase, maxHp: hpBase, speed: 0.52 * speedMultiplier, type: 'normal', radius: 12, state: 'attack', lastAttack: 0, slowTimer: 0, animFrame: 0, animTimer: 0, maxFrames: ZOMBIE_SPRITE_CONF.totalFrames, isDead: false });
            }
        }
    }

    function startNextWave() {
        gameState.wave++; 
        if (gameState.wave > 40) { gameState.gameOver = true; endGame(true); return; }

        gameState.waveTotalSpawned = 0;
        gameState.waveMaxSpawn = 10 + (gameState.wave * 6); gameState.waveZombiesLeft = gameState.waveMaxSpawn;
        gameState.gold += 50 + (gameState.wave * 15); gameState.startDelay = 0; gameState.waveActive = true;
        createParticle(canvas.width/2, canvas.height/4, '#00ffff', 15); updateUI();
    }

    function updateUI() {
        goldVal.innerText = Math.floor(gameState.gold); elecVal.innerText = Math.floor(gameState.electricity);
        if (gameState.choiceActive) waveVal.innerText = `전술 선택 대기 중...`;
        else if (gameState.startDelay > 0) waveVal.innerText = `작전 준비 (⚠️ ${gameState.startDelay}초 후 공세 시작)`;
        else waveVal.innerText = `WAVE ${gameState.wave} (남은 적: ${gameState.waveZombiesLeft})`;
        let min = Math.floor(gameState.time / 60); let sec = gameState.time % 60;
        timerVal.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        
        let url = "background_wall1.png";
        if (gameState.wave > 30) url = "background_wall4.png";
        else if (gameState.wave > 20) url = "background_wall3.png";
        else if (gameState.wave > 10) url = "background_wall2.png";
        document.getElementById('bg-bridge').style.backgroundImage = `url('${url}')`;
    }

    setInterval(() => {
        if (gameState.gameOver || gameState.choiceActive) return;
        gameState.time++;
        if (gameState.startDelay > 0) { gameState.startDelay--; if (gameState.startDelay <= 0) gameState.waveActive = true; }

        if (gate.hp < gate.maxHp) gate.hp = Math.min(gate.maxHp, gate.hp + gate.regen);
        
        let now = Date.now();
        if (gameState.waveActive && now - gameState.lastSpawnTime > 2500) { spawnZombieHorde(); gameState.lastSpawnTime = now; }
        updateUI();
    }, 1000);

    // 오직 성문(Gate)과 군량고(Generator)에서만 자원을 정산하는 핵심 내부 루프
    setInterval(() => {
        if (gameState.gameOver || gameState.choiceActive) return;
        let now = Date.now();

        // [교정 완료]: 성문(Gate)만 레벨 비례 골드를 단독 생산 (50ms마다 누적하므로 초당 gate.level * 2 축적)
        gameState.gold += (gate.level * 0.1); 

        buildings.forEach(b => {
            // 다른 일반 포루(turret, slow, amp)에서는 골드가 생산되지 않도록 완벽 차단됨.
            if (b.type === 'generator') {
                let requiredDelay = Math.max(400, 2000 - (b.level - 1) * 200);
                if (now - b.lastGenTime >= requiredDelay) {
                    let addedGold = b.level * 4; gameState.gold += addedGold;
                    let bX = b.col * cellWidth + cellWidth/2; let bY = gridStartY + b.row * cellHeight + cellHeight/2;
                    
                    if (b.level >= 3) {
                        let addedElec = (b.level - 2); gameState.electricity += addedElec;
                        createPopupText(bX, bY - 10, `+💰${addedGold} +⚡${addedElec}`, '#00ffcc', 10);
                    } else { 
                        createPopupText(bX, bY - 10, `+💰${addedGold}`, '#ffd700', 10); 
                    }
                    b.lastGenTime = now;
                    updateUI();
                }
            }
        });
    }, 50);

    // 사격 연산 제어 루프
    setInterval(() => {
        if (gameState.gameOver || gameState.choiceActive) return;
        let now = Date.now();

        buildings.forEach(b => {
            if (b.type === 'generator' || b.type === 'amp') return;

            let tX = b.col * cellWidth + cellWidth/2; let bY = gridStartY + b.row * cellHeight + cellHeight/2;
            let range = 240; let cooldown = 600;

            if (b.type === 'slow') { range = 160 + (b.level - 1) * 10; cooldown = Math.max(250, 600 - (b.level - 1) * 25); } 
            else if (b.type === 'turret') {
                if (b.subType === 'none') { range = 240 + (b.level - 1) * 12; cooldown = Math.max(200, 600 - (b.level - 1) * 30); } 
                else {
                    let lvlBonus = b.level - 5;
                    if (b.subType === 'multi') { range = 220 + lvlBonus * 12; cooldown = Math.max(150, 500 - lvlBonus * 35); } 
                    else if (b.subType === 'fire') { range = 150 + lvlBonus * 12; cooldown = Math.max(300, 800 - lvlBonus * 35); } 
                    else if (b.subType === 'lightning') { range = 280 + lvlBonus * 12; cooldown = Math.max(100, 350 - lvlBonus * 15); }
                }
            }
            range += globalBuff.rangeBonus;
            if (now - b.lastShot < cooldown) return;

            let liveZombies = zombies.filter(z => !z.isDead && z.y < gate.y + 15);

            if (b.subType === 'lightning') {
                let primary = null;
                liveZombies.forEach(z => { if (Math.hypot(z.x - tX, z.y - bY) < range) { if (!primary || z.y > primary.y) primary = z; } });
                if (primary) {
                    let baseDmg = (6 + (b.level - 5) * 2) * b.buffMultiplier * globalBuff.dmgMultiplier;
                    if(Math.random() < globalBuff.critChance) { baseDmg *= 2; }
                    
                    let chainedTargets = [primary]; chainLines.push({ x1: tX, y1: bY, x2: primary.x, y2: primary.y, alpha: 1.0 });
                    let currentSource = primary;
                    
                    for (let step = 1; step < 5; step++) {
                        let nextTarget = null; let minD = 9999;
                        liveZombies.forEach(z => {
                            if (!chainedTargets.includes(z)) {
                                let d = Math.hypot(z.x - currentSource.x, z.y - currentSource.y); if (d < 120 && d < minD) { minD = d; nextTarget = z; }
                            }
                        });
                        if (nextTarget) { chainedTargets.push(nextTarget); chainLines.push({ x1: currentSource.x, y1: currentSource.y, x2: nextTarget.x, y2: nextTarget.y, alpha: 1.0 }); currentSource = nextTarget; } 
                        else { break; }
                    }
                    chainedTargets.forEach((zb, idx) => {
                        zb.hp -= (baseDmg * Math.pow(0.75, idx)); createParticle(zb.x, zb.y, '#a855f7', 3);
                        if (zb.hp <= 0 && !zb.isDead) {
                            zb.isDead = true;
                            let dropGold = zb.type === 'boss' ? 50 : 2; gameState.gold += dropGold;
                            createPopupText(zb.x, zb.y, `+💰${dropGold}`, '#ffd700', 11); playSoundFX('coin');
                        }
                    });
                    b.lastShot = now; playSoundFX('lightning'); updateUI();
                }
            } 
            else if (b.type === 'turret' && b.subType === 'multi') {
                let count = 0;
                for (let z of liveZombies) {
                    if (Math.hypot(z.x - tX, z.y - bY) < range) {
                        let dmg = (28 + (b.level-5)*10) * b.buffMultiplier * globalBuff.dmgMultiplier;
                        if(Math.random() < globalBuff.critChance) { dmg *= 2; }
                        bullets.push({ x: tX, y: bY, target: z, speed: 11, damage: dmg, type: b.subType });
                        count++; if (count >= 5) break;
                    }
                }
                if (count > 0) { b.lastShot = now; playSoundFX('shoot'); }
            } else {
                let target = null;
                liveZombies.forEach(z => { let dist = Math.hypot(z.x - tX, z.y - bY); if (dist < range) { if(!target || z.y > target.y) target = z; } });
                if (target) {
                    let dmg = 0;
                    if (b.type === 'slow') dmg = 4 + (b.level - 1) * 2;
                    else if (b.type === 'turret' && b.subType === 'none') dmg = 14 + (b.level - 1) * 8;
                    else if (b.subType === 'fire') dmg = 90 + (b.level - 5) * 30;
                    
                    let finalDmg = dmg * b.buffMultiplier * globalBuff.dmgMultiplier;
                    if(Math.random() < globalBuff.critChance) { finalDmg *= 2; }
                    
                    bullets.push({ x: tX, y: bY, target, speed: b.type === 'slow' ? 6 : 9, damage: finalDmg, type: b.subType === 'none' ? b.type : b.subType });
                    b.lastShot = now; playSoundFX('shoot');
                }
            }
        });
    }, 30);

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let currentBG = gameImages.bg1;
        if (gameState.wave > 30) currentBG = gameImages.bg4;
        else if (gameState.wave > 20) currentBG = gameImages.bg3;
        else if (gameState.wave > 10) currentBG = gameImages.bg2;

        if (currentBG.complete && currentBG.width > 0) {
            ctx.save(); ctx.globalAlpha = 0.8; ctx.drawImage(currentBG, 0, 0, canvas.width, canvas.height); ctx.restore();
        } else {
            ctx.fillStyle = '#161616'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.fillStyle = 'rgba(25, 25, 25, 0.2)'; ctx.fillRect(0, gridStartY, canvas.width, gridHeight);
        ctx.strokeStyle = 'rgba(65, 65, 65, 0.5)'; ctx.lineWidth = 1.0;
        for (let i = 0; i <= GRID_COLS; i++) { ctx.beginPath(); ctx.moveTo(i * cellWidth, gridStartY); ctx.lineTo(i * cellWidth, gridStartY + gridHeight); ctx.stroke(); }
        for (let j = 0; j <= GRID_ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, gridStartY + j * cellHeight); ctx.lineTo(canvas.width, gridStartY + j * cellHeight); ctx.stroke(); }

        ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, gate.y); ctx.lineTo(canvas.width, gate.y); ctx.stroke();

        if (gameImages.gate.complete && gameImages.gate.width > 0) { ctx.drawImage(gameImages.gate, gate.x, gate.y, gate.width, gate.height); } 
        else { ctx.fillStyle = '#3a3a3a'; ctx.fillRect(gate.x, gate.y, gate.width, gate.height); }
        ctx.strokeStyle = selectedObject && selectedObject.type === 'gate' ? '#ff4141' : '#64748b'; ctx.lineWidth = 4; ctx.strokeRect(gate.x, gate.y, gate.width, gate.height);

        let hpPercent = Math.max(0, gate.hp / gate.maxHp);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(gate.x, gate.y - 12, gate.width * hpPercent, 6);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`🧱 [${gate.name}] 화성 장벽 Lv.${gate.level} (${Math.floor(gate.hp)}/${gate.maxHp})`, gate.x + gate.width/2, gate.y - 2);

        buildings.forEach(amp => {
            if (amp.type === 'amp') {
                let ampX = amp.col * cellWidth + cellWidth / 2;
                let ampY = gridStartY + amp.row * cellHeight + cellHeight / 2;
                buildings.forEach(target => {
                    if (target.type !== 'generator' && target.type !== 'amp') {
                        if (Math.abs(amp.row - target.row) <= 1 && Math.abs(amp.col - target.col) <= 1) {
                            let tarX = target.col * cellWidth + cellWidth / 2;
                            let tarY = gridStartY + target.row * cellHeight + cellHeight / 2;
                            ctx.save(); ctx.strokeStyle = `rgba(244, 63, 94, ${0.3 + Math.sin(Date.now() / 150) * 0.1})`;
                            ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(ampX, ampY); ctx.lineTo(tarX, tarY); ctx.stroke(); ctx.restore();
                        }
                    }
                });
            }
        });

        buildings.forEach(b => {
            let bX = b.col * cellWidth + cellWidth/2; let bY = gridStartY + b.row * cellHeight + cellHeight/2;
            let size = Math.min(cellWidth, cellHeight) * 0.38; let img = null;

            if (b.type === 'generator') img = gameImages.generator;
            else if (b.type === 'slow') img = gameImages.slow;
            else if (b.type === 'amp') img = gameImages.amp;
            else if (b.type === 'turret') img = gameImages.turret;

            if (b.isBuffed) {
                ctx.save(); ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bX, bY, size + 4, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
            }

            if (selectedObject && selectedObject.row === b.row && selectedObject.col === b.col) {
                ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.strokeRect(bX - size - 4, bY - size - 4, size * 2 + 8, size * 2 + 8);
            }

            if (img && img.complete && img.width > 0) {
                ctx.drawImage(img, bX - size, bY - size, size * 2, size * 2);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                let label = b.type === 'generator' ? `군량${b.level}` : b.type === 'slow' ? `얼음${b.level}` : b.type === 'amp' ? `기치${b.level}` : `포루${b.level}`;
                if (b.subType === 'multi') label = "신기전";
                if (b.subType === 'fire') label = "화차";
                if (b.subType === 'lightning') label = "번개포";
                ctx.fillText(label, bX, bY + size + 9);
            } else {
                ctx.fillStyle = '#555'; ctx.fillRect(bX - size, bY - size, size * 2, size * 2);
            }
        });

        for (let i = chainLines.length - 1; i >= 0; i--) {
            let l = chainLines[i]; ctx.save(); ctx.strokeStyle = `rgba(168, 85, 247, ${l.alpha})`; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke(); ctx.restore();
            l.alpha -= 0.16; if (l.alpha <= 0) chainLines.splice(i, 1);
        }

        for (let i = zombies.length - 1; i >= 0; i--) {
            let z = zombies[i];
            if(z.isDead) { zombies.splice(i, 1); gameState.waveZombiesLeft--; continue; }

            let speed = z.speed; if (z.slowTimer > 0) { z.slowTimer--; speed *= 0.45; }
            
            let targetX = Math.max(gate.x, Math.min(z.x, gate.x + gate.width)); let targetY = gate.y;
            let isCollidingWithGate = (z.x >= gate.x - z.radius && z.x <= gate.x + gate.width + z.radius && z.y >= gate.y - 6 && z.y <= gate.y + gate.height + z.radius);
            
            if (!isCollidingWithGate) { 
                let angle = Math.atan2(targetY - z.y, targetX - z.x); z.x += Math.cos(angle) * speed; z.y += Math.sin(angle) * speed; 
            } else {
                let now = Date.now();
                if (now - z.lastAttack > 1000) {
                    let dmgDealt = z.type === 'boss' ? 350 : (z.type === 'runner' ? 30 : 60);
                    gate.hp -= dmgDealt; z.lastAttack = now;
                    createPopupText(z.x, gate.y - 15, `-💥${dmgDealt}`, '#ff3333', 12); createParticle(z.x, gate.y, '#ff3333', 8);
                    if (gate.hp <= 0) { gameState.gameOver = true; endGame(false); }
                }
            }
            
            z.animTimer++; if (z.animTimer >= 9) { z.animFrame = (z.animFrame + 1) % z.maxFrames; z.animTimer = 0; }

            if (z.type === 'normal' && gameImages.zombie_normal.complete && gameImages.zombie_normal.width > 0) {
                let cellW = ZOMBIE_SPRITE_CONF.sheetWidth / ZOMBIE_SPRITE_CONF.totalFrames; let cellH = ZOMBIE_SPRITE_CONF.sheetHeight;
                let sx = z.animFrame * cellW; let sy = 0;
                ctx.save(); ctx.translate(z.x, z.y);
                let renderH = z.radius * 3.5; let renderW = renderH * (cellW / cellH);
                ctx.drawImage(gameImages.zombie_normal, sx, sy, cellW, cellH, -renderW / 2, -renderH / 2, renderW, renderH);
                ctx.restore();
            } else {
                ctx.fillStyle = z.type === 'boss' ? '#a855f7' : (z.type === 'runner' ? '#ea580c' : '#166534');
                ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2); ctx.fill();
            }
            
            ctx.fillStyle = '#333'; ctx.fillRect(z.x - 12, z.y - z.radius - 6, 24, 3);
            ctx.fillStyle = z.slowTimer > 0 ? '#00ffff' : '#22c55e'; ctx.fillRect(z.x - 12, z.y - z.radius - 6, 24 * (z.hp / z.maxHp), 3);
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; 
            if (!zombies.includes(b.target) || b.target.isDead) { bullets.splice(i, 1); continue; }

            let dx = b.target.x - b.x; let dy = b.target.y - b.y; let d = Math.hypot(dx, dy);
            if (d < b.target.radius) {
                let finalDamage = b.damage;
                if (b.type === 'fire' && b.target.slowTimer > 0) {
                    finalDamage *= 2.5; createPopupText(b.target.x, b.target.y - 12, "💥融化 MELT 2.5x!💥", '#ff4d4d', 13);
                }

                if (b.type === 'fire') {
                    zombies.forEach(z => {
                        if (!z.isDead && Math.hypot(z.x - b.target.x, z.y - b.target.y) < 45) {
                            z.hp -= finalDamage; createParticle(z.x, z.y, '#ef4444', 3);
                            if (z.hp <= 0 && !z.isDead) { z.isDead = true; gameState.gold += 3; }
                        }
                    });
                } else {
                    b.target.hp -= finalDamage;
                }
                
                if (b.type === 'slow') b.target.slowTimer = 120;
                createParticle(b.target.x, b.target.y, b.type === 'fire' ? '#ef4444' : (b.type === 'slow' ? '#00ffff' : '#f59e0b'), 4);
                
                if (b.target.hp <= 0 && !b.target.isDead) {
                    b.target.isDead = true;
                    let drop = b.target.type === 'boss' ? 60 : 3; gameState.gold += drop;
                    createPopupText(b.target.x, b.target.y, `+💰${drop}`, '#ffd700', 11); playSoundFX('coin');
                }
                bullets.splice(i, 1);
            } else { 
                b.x += (dx/d)*b.speed; b.y += (dy/d)*b.speed; 
                ctx.fillStyle = b.type === 'fire' ? '#ff4d4d' : (b.type === 'slow' ? '#00ffff' : '#f59e0b'); 
                ctx.beginPath(); ctx.arc(b.x, b.y, b.type === 'fire' ? 5.5 : 3.2, 0, Math.PI*2); ctx.fill(); 
            }
        }

        for(let i=textPopups.length-1; i>=0; i--) { 
            let t = textPopups[i]; t.y += t.ySpeed; t.alpha -= 0.035; 
            if(t.alpha<=0) textPopups.splice(i,1); 
            else { ctx.save(); ctx.globalAlpha=t.alpha; ctx.fillStyle=t.color; ctx.font=`bold ${t.size}px sans-serif`; ctx.textAlign='center'; ctx.fillText(t.text,t.x,t.y); ctx.restore(); } 
        }
        for(let i=particles.length-1; i>=0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.04; if(p.alpha<=0) particles.splice(i,1); else { ctx.save(); ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2); ctx.fill(); ctx.restore(); } }

        if (gameState.waveActive && gameState.waveZombiesLeft <= 0 && zombies.length === 0 && !gameState.choiceActive) {
            gameState.waveActive = false;
            if (gameState.wave % 5 === 0) triggerRogueChoice();
            else startNextWave();
        }

        if (gameState.gameOver === false) requestAnimationFrame(gameLoop);
    }

    function endGame(isWin = false) { 
        if (bgmInterval) clearTimeout(bgmInterval); playSoundFX('gameover'); 
        const goScreen = document.getElementById('game-over-screen'); goScreen.style.display = 'flex'; 
        const title = goScreen.querySelector('h1');
        title.innerText = isWin ? "수성 대승리!" : "성문 돌파됨";
        title.style.color = isWin ? "#00ff00" : "#ff4d4d";
        document.getElementById('go-desc').innerText = isWin ? "40 웨이브 전선을 끝까지 완벽하게 사수했습니다!" : `최종 방어 단계: WAVE ${gameState.wave}`; 
    }
    
    document.getElementById('restart-btn').addEventListener('click', () => location.reload());
    resizeCanvas(); updateUI(); requestAnimationFrame(gameLoop);
</script>
</body>
</html>
