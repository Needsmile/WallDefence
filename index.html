<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>요새 요격전 - 범위 버프 비주얼 및 스태이터스 완벽 수정 패치</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; touch-action: manipulation; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 600px; margin: 0 auto; background: #1a1a1a; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #top-ui { height: 55px; background: #222; border-bottom: 3px solid #333; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; font-size: 13px; font-weight: bold; z-index: 5; }
        .ui-stat { display: flex; align-items: center; gap: 4px; }
        .gold-text { color: #ffd700; }
        .elec-text { color: #00ffff; }
        .wave-text { color: #ff4d4d; }
        #canvas-container { flex: 1; position: relative; background: #141414; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #bottom-ui { height: 95px; background: #222; border-top: 3px solid #333; display: flex; justify-content: space-around; align-items: center; padding: 8px; gap: 6px; z-index: 5; }
        .build-btn { flex: 1; height: 100%; background: #2b2b2b; border: 2px solid #444; border-radius: 8px; color: #fff; font-weight: bold; font-size: 11px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; transition: all 0.1s; }
        .build-btn.active { border-color: #00ffff; background: #1e2e2e; transform: scale(1.03); }
        .cost-tag { font-size: 9px; color: #ffd700; }
        
        #upgrade-modal { display: none; position: absolute; bottom: 110px; left: 5%; width: 90%; background: rgba(20, 20, 20, 0.98); border: 2px solid #ff4141; border-radius: 10px; padding: 15px; z-index: 10; box-shadow: 0 0 15px rgba(255,65,65,0.4); }
        .modal-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #ff4141; display: flex; justify-content: space-between; }
        .modal-close { cursor: pointer; color: #ff4d4d; padding: 0 5px; }
        .modal-info { font-size: 12px; margin-bottom: 12px; line-height: 1.6; color: #ddd; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: #292929; padding: 8px; border-radius: 5px; margin-bottom: 10px; border-left: 3px solid #ff4141; font-size: 11px; }
        .modal-btn { width: 100%; padding: 10px; background: #ff4141; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 5px; }
        .modal-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        
        .evo-container { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; border-top: 1px dashed #444; padding-top: 10px; }
        .evo-btn { padding: 6px 4px; border: 1px solid #555; background: #1f1f1f; color: #fff; font-size: 9px; border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center; }

        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #restart-btn { padding: 12px 35px; font-size: 16px; background: #ff4d4d; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #sound-notice { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 15px; font-size: 10px; color: #ffd700; z-index: 4; pointer-events: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="sound-notice">탭하면 게임 오디오가 주입됩니다 🔊</div>
    <div id="top-ui">
        <div class="ui-stat">💰 <span id="gold-val" class="gold-text">350</span></div>
        <div class="ui-stat">⚡ <span id="elec-val" class="elec-text">0</span></div>
        <div class="ui-stat">☠️ <span id="wave-val" class="wave-text">WAVE 1</span></div>
        <div id="timer-val">00:00</div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="upgrade-modal">
            <div class="modal-title"><span id="m-title">건물 정보</span><span class="modal-close" id="m-close">✕</span></div>
            <div class="modal-info" id="m-info">설명</div>
            <div class="status-grid" id="m-status">내용</div>
            <button class="modal-btn" id="m-upgrade-btn">업그레이드</button>
            
            <div class="evo-container" id="m-evo-box">
                <div class="evo-btn" id="evo-multi" style="border-color:#ffd700; color:#ffd700;">🏹멀티샷<br>💰250</div>
                <div class="evo-btn" id="evo-fire" style="border-color:#ff4d4d; color:#ff4d4d;">🔥불속성<br>💰250</div>
                <div class="evo-btn" id="evo-lightning" style="border-color:#a855f7; color:#a855f7;">⚡체인번개<br>💰250</div>
            </div>
        </div>
    </div>

    <div id="bottom-ui">
        <button class="build-btn" id="btn-generator"><div>⚡ 발전기</div><div class="cost-tag">💰60</div></button>
        <button class="build-btn" id="btn-turret"><div>🏹 기본타워</div><div class="cost-tag">💰70</div></button>
        <button class="build-btn" id="btn-slow"><div>❄️ 슬로우</div><div class="cost-tag" style="color:#00ffff">💰100 ⚡1</div></button>
        <button class="build-btn" id="btn-amp"><div>⚙️ 증폭타워</div><div class="cost-tag" style="color:#ff00ff">💰160 ⚡3</div></button>
    </div>

    <div id="game-over-screen">
        <h1 style="color:#ff4d4d; font-size:32px;">FORTRESS FALLEN</h1>
        <p id="go-desc" style="color: #aaa; font-size: 14px;"></p>
        <button id="restart-btn">다시 도전</button>
    </div>
</div>

<script>
    // ==========================================
    // 이미지 로더 설정
    // ==========================================
    const gameImages = {
        zombie_normal: new Image(), zombie_runner: new Image(), zombie_boss: new Image(),
        generator: new Image(), turret: new Image(), slow: new Image(), amp: new Image(), gate: new Image()
    };
    gameImages.zombie_normal.src = "zombie_normal.png"; 
    gameImages.zombie_runner.src = "zombie_runner.png";
    gameImages.zombie_boss.src = "zombie_boss.png";
    gameImages.generator.src = "generator.png";
    gameImages.turret.src = "turret_base.png";
    gameImages.slow.src = "turret_slow.png";
    gameImages.amp.src = "turret_amp.png";
    gameImages.gate.src = "castle_gate.png";

    // ==========================================
    // 사운드 시스템
    // ==========================================
    let audioCtx = null; let bgmInterval = null;
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startBGM();
        if(document.getElementById('sound-notice')) document.getElementById('sound-notice').style.display = 'none';
    }
    const bgmMelody = [
        {f: 261, d: 0.12}, {f: 329, d: 0.12}, {f: 392, d: 0.12}, {f: 523, d: 0.2},
        {f: 0, d: 0.05}, {f: 494, d: 0.12}, {f: 392, d: 0.12}, {f: 329, d: 0.12}
    ];
    let bgmIndex = 0;
    function startBGM() {
        if (!audioCtx) return;
        function playNextNote() {
            if (gameState.gameOver) return;
            let note = bgmMelody[bgmIndex];
            if (note.f > 0) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + note.d);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + note.d);
            }
            bgmIndex = (bgmIndex + 1) % bgmMelody.length;
            bgmInterval = setTimeout(playNextNote, note.d * 1100);
        }
        playNextNote();
    }
    function playSoundFX(type) {
        if (!audioCtx) return; let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        if (type === 'shoot') {
            osc.type = 'square'; osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.07);
            gain.gain.setValueAtTime(0.02, now); gain.gain.linearRampToValueAtTime(0, now + 0.07);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.07);
        } else if (type === 'lightning') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(300, now + 0.04);
            gain.gain.setValueAtTime(0.015, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.08);
        } else if (type === 'coin') {
            osc.type = 'square'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1200, now + 0.06);
            gain.gain.setValueAtTime(0.02, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.15);
        } else if (type === 'gameover') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(220, now); osc.frequency.linearRampToValueAtTime(40, now + 0.7);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.7);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.7);
        }
    }

    // ==========================================
    // 게임 시스템 데이터 및 규격 연산
    // ==========================================
    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let gameState = { 
        gold: 350, electricity: 0, wave: 1, time: 0, gameOver: false, 
        waveZombiesLeft: 12, waveTotalSpawned: 0, waveMaxSpawn: 12, lastSpawnTime: 0,
        waveActive: false, startDelay: 5 
    };
    
    const GRID_ROWS = 7; const GRID_COLS = 7;
    let cellWidth = 0; let cellHeight = 0; let gridStartY = 0; let gridHeight = 0;
    let gate = { x: 0, y: 0, width: 140, height: 26, hp: 1500, maxHp: 1500, level: 1, regen: 4, upgradeCost: 150 };

    function updateGridDimensions() {
        gridStartY = canvas.height * 0.55; gridHeight = canvas.height * 0.42;
        cellWidth = canvas.width / GRID_COLS; cellHeight = gridHeight / GRID_ROWS;
        gate.x = canvas.width / 2 - gate.width / 2; gate.y = gridStartY - gate.height - 4;
    }
    function resizeCanvas() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; updateGridDimensions(); }
    window.addEventListener('resize', resizeCanvas);

    let selectedObject = null;
    let buildings = []; let zombies = []; let bullets = []; let particles = []; let textPopups = []; let chainLines = [];
    let currentBuildMode = 'none'; 
    let globalBuff = { rangeBonus: 0, maxAmpLevel: 0 };

    const goldVal = document.getElementById('gold-val'); const elecVal = document.getElementById('elec-val');
    const waveVal = document.getElementById('wave-val'); const timerVal = document.getElementById('timer-val');
    const upgradeModal = document.getElementById('upgrade-modal');

    window.addEventListener('click', initAudio); window.addEventListener('touchstart', initAudio);

    const modes = ['generator', 'turret', 'slow', 'amp'];
    modes.forEach(mode => {
        document.getElementById(`btn-${mode}`).addEventListener('click', (e) => { e.stopPropagation(); setBuildMode(currentBuildMode === mode ? 'none' : mode); });
    });

    function setBuildMode(mode) {
        currentBuildMode = mode;
        modes.forEach(m => document.getElementById(`btn-${m}`).classList.toggle('active', currentBuildMode === m));
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top;
        if (x >= gate.x && x <= gate.x + gate.width && y >= gate.y && y <= gate.y + gate.height) {
            selectedObject = { type: 'gate' }; showGateUpgradeModal(); return;
        }
        if (y >= gridStartY && y <= gridStartY + gridHeight) {
            const col = Math.floor(x / cellWidth); const row = Math.floor((y - gridStartY) / cellHeight);
            if (col >= 0 && col < GRID_COLS && row >= 0 && row < GRID_ROWS) handleGridClick(row, col);
        } else { upgradeModal.style.display = 'none'; selectedObject = null; }
    });

    function handleGridClick(row, col) {
        const existing = buildings.find(b => b.row === row && b.col === col);
        if (currentBuildMode !== 'none') {
            if (existing) return;
            let cost = 0; let elecCost = 0;
            if (currentBuildMode === 'generator') cost = 60;
            else if (currentBuildMode === 'turret') cost = 70;
            else if (currentBuildMode === 'slow') { cost = 100; elecCost = 1; }
            else if (currentBuildMode === 'amp') { cost = 160; elecCost = 3; }

            if (gameState.gold >= cost && gameState.electricity >= elecCost) {
                gameState.gold -= cost; gameState.electricity -= elecCost;
                buildings.push({ row, col, type: currentBuildMode, level: 1, subType: 'none', lastShot: 0, lastGenTime: Date.now(), isBuffed: false, buffMultiplier: 1.0 });
                createParticle(col * cellWidth + cellWidth/2, gridStartY + row * cellHeight + cellHeight/2, '#ffffff', 12);
                setBuildMode('none'); recalculateBuffs(); updateUI();
            }
        } else if (existing) { 
            selectedObject = existing; 
            showUpgradeModal(existing); 
        }
    }

    // ==========================================
    // 3x3 격자 범위 및 실시간 모달 텍스트 동기화
    // ==========================================
    function recalculateBuffs() {
        let maxAmp = 0;
        buildings.forEach(b => { 
            if (b.type === 'amp') { if (b.level > maxAmp) maxAmp = b.level; } 
            b.isBuffed = false;
            b.buffMultiplier = 1.0;
        });
        
        globalBuff.maxAmpLevel = maxAmp;
        globalBuff.rangeBonus = maxAmp * 12;

        buildings.forEach(amp => {
            if (amp.type === 'amp') {
                let ampPower = 1.0 + (amp.level * 0.15);
                buildings.forEach(target => {
                    if (target.type !== 'generator' && target.type !== 'amp') {
                        if (Math.abs(amp.row - target.row) <= 1 && Math.abs(amp.col - target.col) <= 1) {
                            target.isBuffed = true;
                            if (ampPower > target.buffMultiplier) {
                                target.buffMultiplier = ampPower;
                            }
                        }
                    }
                });
            }
        });

        // 모달이 열려있는 도중 버프 상태가 바뀌면 수치도 실시간 갱신
        if (upgradeModal.style.display === 'block' && selectedObject && selectedObject.type !== 'gate') {
            showUpgradeModal(selectedObject);
        }
    }

    function showGateUpgradeModal() {
        upgradeModal.style.display = 'block'; document.getElementById('m-evo-box').style.display = 'none';
        const upBtn = document.getElementById('m-upgrade-btn'); upBtn.style.display = 'block';
        
        document.getElementById('m-title').innerText = `🧱 요새 중앙 성문 (Lv.${gate.level})`;
        document.getElementById('m-info').innerHTML = "내구도 및 초당 자동 회복량을 늘려 적들의 공세를 버텨냅니다.";
        document.getElementById('m-status').innerHTML = `<div>최대 체력: ${gate.maxHp}</div><div>초당 회복: +${gate.regen}</div>`;
        
        upBtn.innerText = `성문 강화 (💰${gate.upgradeCost})`; upBtn.disabled = gameState.gold < gate.upgradeCost;
        upBtn.onclick = () => {
            if (gameState.gold >= gate.upgradeCost) {
                gameState.gold -= gate.upgradeCost; gate.level++; gate.maxHp += 800; gate.hp = gate.maxHp; gate.regen += 3;
                gate.upgradeCost = Math.floor(gate.upgradeCost * 1.6);
                createParticle(gate.x + gate.width/2, gate.y + gate.height/2, '#ffd700', 20);
                upgradeModal.style.display = 'none'; selectedObject = null; updateUI();
            }
        };
    }

    // ==========================================
    // [핵심 패치] 공격력 추가 스태이터스 괄호 () 적용
    // ==========================================
    function showUpgradeModal(building) {
        upgradeModal.style.display = 'block';
        const evoBox = document.getElementById('m-evo-box'); const upBtn = document.getElementById('m-upgrade-btn');
        evoBox.style.display = "none"; upBtn.style.display = "block"; upBtn.disabled = false;

        let costGold = Math.floor(50 * Math.pow(1.5, building.level));
        if (building.type === 'amp') costGold = Math.floor(130 * Math.pow(1.7, building.level));
        if (building.subType !== 'none') costGold = Math.floor(140 * Math.pow(1.6, building.level - 4));

        let typeName = building.subType !== 'none' ? `${building.subType.toUpperCase()} 타워` : building.type.toUpperCase();
        document.getElementById('m-title').innerText = `${typeName} (Lv.${building.level})`;
        
        let desc = ""; let statusHtml = "";
        let isLocked = (building.type !== 'amp' && building.level >= 7 && globalBuff.maxAmpLevel < 3);

        if (building.level >= 10) {
            upBtn.innerText = `최대 레벨 도달 (Lv.10)`; upBtn.disabled = true;
        } else if (isLocked) {
            upBtn.innerText = `⚠️ 돌파 불가 (AMP Lv.3 필요)`; upBtn.disabled = true;
        } else {
            upBtn.innerText = `업그레이드 (💰${costGold})`;
            if (gameState.gold < costGold) upBtn.disabled = true;
        }

        if (building.type === 'generator') {
            let currentCooldown = Math.max(400, 2000 - (building.level - 1) * 200) / 1000;
            let nextCooldown = Math.max(400, 2000 - building.level * 200) / 1000;
            desc = "골드와 전력을 보급하는 시설입니다. 업그레이드 시 충전 및 보급 딜레이 시간이 감소합니다.";
            statusHtml = `<div style="color:#ffd700;">생산 골드: +${building.level * 4}</div>
                         <div style="color:#00ffff;">생산 전력: ${building.level >= 3 ? `+${building.level - 2}` : '0'}</div>
                         <div style="grid-column: span 2; color:#a855f7; margin-top:4px;">보급 주기: ${currentCooldown}초 ➔ <span style="color:#00ff00;">${building.level >= 10 ? 'MAX' : nextCooldown + '초'}</span></div>`;
        } else if (building.type === 'amp') {
            desc = "주변 3x3 범위 타일 안에 건설된 공격형 타워들을 활성화하여 화력을 증폭시킵니다.";
            statusHtml = `<div style="grid-column: span 2; color:#ff4141; font-size:12px; text-align:center; padding:4px;">해당 격자내 공격력 상승률: +${building.level * 15}%</div>`;
        } else if (building.type === 'slow') {
            let baseDmg = 4 + (building.level - 1) * 2; 
            let finalDmg = Math.floor(baseDmg * building.buffMultiplier);
            let bonusDmg = finalDmg - baseDmg;
            let buffString = building.isBuffed ? ` <span style="color:#ff4141; font-weight:bold;">(+${bonusDmg})</span>` : '';

            let range = 160 + (building.level - 1) * 10 + globalBuff.rangeBonus;
            let spd = (1000 / (600 - (building.level - 1) * 25)).toFixed(1);
            statusHtml = `<div>감속피해: ${finalDmg}${buffString}</div><div>사거리: ${range}px</div><div style="grid-column:span 2; color:#3b82f6;">공격 속도: ${spd}회/초</div>`;
        } else if (building.type === 'turret') {
            if (building.subType === 'none') {
                let baseDmg = 14 + (building.level - 1) * 8; 
                let finalDmg = Math.floor(baseDmg * building.buffMultiplier);
                let bonusDmg = finalDmg - baseDmg;
                let buffString = building.isBuffed ? ` <span style="color:#ff4141; font-weight:bold;">(+${bonusDmg})</span>` : '';

                let range = 240 + (building.level - 1) * 12 + globalBuff.rangeBonus;
                let spd = (1000 / (600 - (building.level - 1) * 30)).toFixed(1);
                statusHtml = `<div>공격력: ${finalDmg}${buffString}</div><div>사거리: ${range}px</div><div style="grid-column:span 2; color:#f59e0b;">공격 속도: ${spd}회/초</div>`;
                if (building.level >= 5) { upBtn.style.display = "none"; evoBox.style.display = "grid"; setupEvoEvents(building); }
            } else {
                let rangeBonus = (building.level - 5) * 12; let speedBonus = (building.level - 5) * 35;
                if (building.subType === 'multi') {
                    let baseDmg = 28 + (building.level - 5) * 10;
                    let finalDmg = Math.floor(baseDmg * building.buffMultiplier);
                    let bonusDmg = finalDmg - baseDmg;
                    let buffString = building.isBuffed ? ` <span style="color:#ff4141; font-weight:bold;">(+${bonusDmg})</span>` : '';

                    let spd = (1000 / (500 - speedBonus)).toFixed(1);
                    statusHtml = `<div>공격력: ${finalDmg}${buffString}</div><div>사거리: ${220 + rangeBonus}px</div><div style="grid-column:span 2;">공격 속도: ${spd}회/초 (3타겟)</div>`;
                } else if (building.subType === 'fire') {
                    let baseDmg = 90 + (building.level - 5) * 30;
                    let finalDmg = Math.floor(baseDmg * building.buffMultiplier);
                    let bonusDmg = finalDmg - baseDmg;
                    let buffString = building.isBuffed ? ` <span style="color:#ff4141; font-weight:bold;">(+${bonusDmg})</span>` : '';

                    let spd = (1000 / (800 - speedBonus)).toFixed(1);
                    statusHtml = `<div>폭발피해: ${finalDmg}${buffString}</div><div>사거리: ${150 + rangeBonus}px</div><div style="grid-column:span 2;">공격 속도: ${spd}회/초 (범위폭발)</div>`;
                } else if (building.subType === 'lightning') {
                    let baseDmg = 6 + (building.level - 5) * 2;
                    let finalDmg = Math.floor(baseDmg * building.buffMultiplier);
                    let bonusDmg = finalDmg - baseDmg;
                    let buffString = building.isBuffed ? ` <span style="color:#ff4141; font-weight:bold;">(+${bonusDmg})</span>` : '';

                    let spd = (1000 / (350 - (building.level - 5) * 15)).toFixed(1);
                    statusHtml = `<div>체인피해: ${finalDmg}${buffString}</div><div>사거리: ${280 + rangeBonus}px</div><div style="grid-column:span 2;">공격 속도: ${spd}회/초 (3연쇄)</div>`;
                }
            }
        }
        document.getElementById('m-info').innerHTML = desc; document.getElementById('m-status').innerHTML = statusHtml;
        
        upBtn.onclick = () => {
            if (gameState.gold >= costGold) {
                gameState.gold -= costGold; building.level++;
                if (building.type === 'generator' && building.level >= 3) gameState.electricity += 1;
                recalculateBuffs(); showUpgradeModal(building); updateUI();
            }
        };
    }
    document.getElementById('m-close').onclick = () => { upgradeModal.style.display = 'none'; selectedObject = null; };

    function setupEvoEvents(building) {
        ['multi', 'fire', 'lightning'].forEach(type => {
            document.getElementById(`evo-${type}`).onclick = () => {
                if (gameState.gold >= 250) {
                    gameState.gold -= 250; building.subType = type; building.level = 5;
                    createParticle(canvas.width/2, gridStartY, '#ffd700', 25);
                    recalculateBuffs(); showUpgradeModal(building); updateUI();
                }
            };
        });
    }

    function createParticle(x, y, color, count) {
        for(let i=0; i<count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, radius: Math.random()*2.5+1, color, alpha: 1 });
    }
    function createPopupText(x, y, text, color, size) { textPopups.push({ x, y, text: text, color: color, alpha: 1, size: size, ySpeed: -0.8 }); }

    function spawnZombieHorde() {
        if (gameState.gameOver || !gameState.waveActive || gameState.waveTotalSpawned >= gameState.waveMaxSpawn) return;
        let hpBase = 40 + Math.pow(gameState.wave, 1.45) * 16;
        let speedMultiplier = Math.min(2.0, 0.9 + (gameState.wave * 0.07));
        let hordeSize = Math.min(8, 3 + Math.floor(gameState.wave / 3));
        
        for (let k = 0; k < hordeSize; k++) {
            if (gameState.waveTotalSpawned >= gameState.waveMaxSpawn) break;
            gameState.waveTotalSpawned++;
            let spawnX = 20 + Math.random() * (canvas.width - 40); let spawnY = -20 - (Math.random() * 50);
            
            if (gameState.wave % 5 === 0 && gameState.waveTotalSpawned === 1) {
                zombies.push({ x: canvas.width/2, y: -40, hp: hpBase*6, maxHp: hpBase*6, speed: 0.20 * speedMultiplier, type: 'boss', radius: 20, state: 'attack', retreatTarget: 0, lastAttack: 0, slowTimer: 0, animFrame: 0, animTimer: 0, maxFrames: 6 });
            } else if (Math.random() > 0.7) {
                zombies.push({ x: spawnX, y: spawnY, hp: hpBase*0.5, maxHp: hpBase*0.5, speed: 1.1 * speedMultiplier, type: 'runner', radius: 9, state: 'attack', retreatTarget: 0, lastAttack: 0, slowTimer: 0, animFrame: 0, animTimer: 0, maxFrames: 6 });
            } else {
                zombies.push({ x: spawnX, y: spawnY, hp: hpBase, maxHp: hpBase, speed: 0.52 * speedMultiplier, type: 'normal', radius: 12, state: 'attack', retreatTarget: 0, lastAttack: 0, slowTimer: 0, animFrame: 0, animTimer: 0, maxFrames: 4 });
            }
        }
    }

    function startNextWave() {
        gameState.wave++; gameState.waveTotalSpawned = 0;
        gameState.waveMaxSpawn = 10 + (gameState.wave * 6); gameState.waveZombiesLeft = gameState.waveMaxSpawn;
        gameState.gold += 50 + (gameState.wave * 15); gameState.startDelay = 0; gameState.waveActive = true;
        createParticle(canvas.width/2, canvas.height/4, '#00ffff', 15); updateUI();
    }

    function updateUI() {
        goldVal.innerText = Math.floor(gameState.gold); elecVal.innerText = Math.floor(gameState.electricity);
        if (gameState.startDelay > 0) waveVal.innerText = `준비 단계 (⚠️ ${gameState.startDelay}초 후 시작)`;
        else waveVal.innerText = `WAVE ${gameState.wave} (남은 적: ${gameState.waveZombiesLeft})`;
        let min = Math.floor(gameState.time / 60); let sec = gameState.time % 60;
        timerVal.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    setInterval(() => {
        if (gameState.gameOver) return;
        gameState.time++;
        if (gameState.startDelay > 0) { gameState.startDelay--; if (gameState.startDelay <= 0) gameState.waveActive = true; }

        if (gate.hp < gate.maxHp) gate.hp = Math.min(gate.maxHp, gate.hp + gate.regen);
        if (gameState.waveActive && gameState.waveZombiesLeft <= 0 && zombies.length === 0) startNextWave();
        let now = Date.now();
        if (gameState.waveActive && now - gameState.lastSpawnTime > 2500) { spawnZombieHorde(); gameState.lastSpawnTime = now; }
        updateUI();
    }, 1000);

    setInterval(() => {
        if (gameState.gameOver) return;
        let now = Date.now();

        buildings.forEach(b => {
            if (b.type === 'generator') {
                let requiredDelay = Math.max(400, 2000 - (b.level - 1) * 200);
                if (now - b.lastGenTime >= requiredDelay) {
                    let addedGold = b.level * 4; gameState.gold += addedGold;
                    let bX = b.col * cellWidth + cellWidth/2; let bY = gridStartY + b.row * cellHeight + cellHeight/2;
                    
                    if (b.level >= 3) {
                        let addedElec = (b.level - 2); gameState.electricity += addedElec;
                        createPopupText(bX, bY - 10, `+💰${addedGold} +⚡${addedElec}`, '#00ffcc', 10);
                    } else { 
                        createPopupText(bX, bY - 10, `+💰${addedGold}`, '#ffd700', 10); 
                    }
                    b.lastGenTime = now;
                    updateUI();
                }
            }
        });
    }, 50);

    // 공격 및 사격 제어 루프
    setInterval(() => {
        if (gameState.gameOver) return;
        let now = Date.now();

        buildings.forEach(b => {
            if (b.type === 'generator' || b.type === 'amp') return;

            let tX = b.col * cellWidth + cellWidth/2; let tY = gridStartY + b.row * cellHeight + cellHeight/2;
            let range = 240; let cooldown = 600;

            if (b.type === 'slow') { range = 160 + (b.level - 1) * 10; cooldown = Math.max(250, 600 - (b.level - 1) * 25); } 
            else if (b.type === 'turret') {
                if (b.subType === 'none') { range = 240 + (b.level - 1) * 12; cooldown = Math.max(200, 600 - (b.level - 1) * 30); } 
                else {
                    let lvlBonus = b.level - 5;
                    if (b.subType === 'multi') { range = 220 + lvlBonus * 12; cooldown = Math.max(150, 500 - lvlBonus * 35); } 
                    else if (b.subType === 'fire') { range = 150 + lvlBonus * 12; cooldown = Math.max(300, 800 - lvlBonus * 35); } 
                    else if (b.subType === 'lightning') { range = 280 + lvlBonus * 12; cooldown = Math.max(100, 350 - lvlBonus * 15); }
                }
            }
            range += globalBuff.rangeBonus;
            if (now - b.lastShot < cooldown) return;

            if (b.subType === 'lightning') {
                let primary = null;
                zombies.forEach(z => { if (Math.hypot(z.x - tX, z.y - tY) < range && z.y < gate.y + gate.height + 10) { if (!primary || z.y > primary.y) primary = z; } });
                if (primary) {
                    let baseDmg = (6 + (b.level - 5) * 2) * b.buffMultiplier;
                    let chainedTargets = [primary]; chainLines.push({ x1: tX, y1: tY, x2: primary.x, y2: primary.y, alpha: 1.0 });
                    let currentSource = primary;
                    for (let step = 1; step < 3; step++) {
                        let nextTarget = null; let minD = 9999;
                        zombies.forEach(z => {
                            if (!chainedTargets.includes(z) && z.y < gate.y + gate.height + 10) {
                                let d = Math.hypot(z.x - currentSource.x, z.y - currentSource.y); if (d < 120 && d < minD) { minD = d; nextTarget = z; }
                            }
                        });
                        if (nextTarget) { chainedTargets.push(nextTarget); chainLines.push({ x1: currentSource.x, y1: currentSource.y, x2: nextTarget.x, y2: nextTarget.y, alpha: 1.0 }); currentSource = nextTarget; } 
                        else { break; }
                    }
                    chainedTargets.forEach((zb, idx) => {
                        zb.hp -= (baseDmg * Math.pow(0.75, idx)); createParticle(zb.x, zb.y, '#a855f7', 3);
                        if (zb.hp <= 0) {
                            let idxZ = zombies.indexOf(zb);
                            if (idxZ !== -1) {
                                let dropGold = zb.type === 'boss' ? 50 : 2; gameState.gold += dropGold; gameState.waveZombiesLeft--;
                                createPopupText(zb.x, zb.y, `+💰${dropGold}`, '#ffd700', 11); playSoundFX('coin'); zombies.splice(idxZ, 1);
                            }
                        }
                    });
                    b.lastShot = now; playSoundFX('lightning'); updateUI();
                }
            } else if (b.type === 'turret' && b.subType === 'multi') {
                let count = 0;
                for (let z of zombies) {
                    if (z.y < gate.y + gate.height + 10 && Math.hypot(z.x - tX, z.y - tY) < range) {
                        let dmg = (28 + (b.level-5)*10) * b.buffMultiplier;
                        bullets.push({ x: tX, y: tY, target: z, speed: 11, damage: dmg, type: b.subType });
                        count++; if (count >= 3) break;
                    }
                }
                if (count > 0) { b.lastShot = now; playSoundFX('shoot'); }
            } else {
                let target = null;
                zombies.forEach(z => { let dist = Math.hypot(z.x - tX, z.y - tY); if (dist < range && z.y < gate.y + gate.height + 10) { if(!target || z.y > target.y) target = z; } });
                if (target) {
                    let dmg = 0;
                    if (b.type === 'slow') dmg = 4 + (b.level - 1) * 2;
                    else if (b.type === 'turret' && b.subType === 'none') dmg = 14 + (b.level - 1) * 8;
                    else if (b.subType === 'fire') dmg = 90 + (b.level - 5) * 30;
                    bullets.push({ x: tX, y: tY, target, speed: b.type === 'slow' ? 6 : 9, damage: dmg * b.buffMultiplier, type: b.subType === 'none' ? b.type : b.subType });
                    b.lastShot = now; playSoundFX('shoot');
                }
            }
        });
    }, 30);

    // ==========================================
    // 렌더링 루프 (비주얼 가시성 링 필터 보정)
    // ==========================================
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#161616'; ctx.fillRect(0, gridStartY, canvas.width, gridHeight);
        ctx.strokeStyle = '#252525'; ctx.lineWidth = 1.2;
        for (let i = 0; i <= GRID_COLS; i++) { ctx.beginPath(); ctx.moveTo(i * cellWidth, gridStartY); ctx.lineTo(i * cellWidth, gridStartY + gridHeight); ctx.stroke(); }
        for (let j = 0; j <= GRID_ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, gridStartY + j * cellHeight); ctx.lineTo(canvas.width, gridStartY + j * cellHeight); ctx.stroke(); }

        ctx.fillStyle = '#2d2d2d'; ctx.fillRect(0, gate.y + gate.height, canvas.width, 4);

        if (gameImages.gate.complete && gameImages.gate.width > 0) { ctx.drawImage(gameImages.gate, gate.x, gate.y, gate.width, gate.height); } 
        else { ctx.fillStyle = '#444'; ctx.fillRect(gate.x, gate.y, gate.width, gate.height); }
        ctx.strokeStyle = selectedObject && selectedObject.type === 'gate' ? '#ff4141' : '#b45309'; ctx.lineWidth = 4; ctx.strokeRect(gate.x, gate.y, gate.width, gate.height);

        let hpPercent = gate.hp / gate.maxHp;
        ctx.fillStyle = '#ff4d4d'; ctx.fillRect(gate.x, gate.y - 12, gate.width * hpPercent, 5);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`🧱 성문 Lv.${gate.level} (${Math.floor(gate.hp)}/${gate.maxHp})`, gate.x + gate.width/2, gate.y - 18);

        if (gameState.startDelay > 0 && gameState.wave === 1) {
            ctx.fillStyle = `rgba(239, 68, 68, ${0.6 + Math.sin(Date.now()/120)*0.3})`; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText("⚠️ 적들이 몰려옵니다! 전선 구축을 준비하세요...", canvas.width / 2, canvas.height * 0.25);
        }

        buildings.forEach(b => {
            let bX = b.col * cellWidth + cellWidth/2; let bY = gridStartY + b.row * cellHeight + cellHeight/2;
            let size = Math.min(cellWidth, cellHeight) * 0.38; let img = null;

            if (b.type === 'generator') img = gameImages.generator;
            else if (b.type === 'slow') img = gameImages.slow;
            else if (b.type === 'amp') img = gameImages.amp;
            else if (b.type === 'turret') img = gameImages.turret;

            // [패치 핵심 코드] 연한 Red 계열의 은은한 오라 이펙트 적용
            if (b.isBuffed) {
                ctx.save();
                // 투명도가 진하지 않고 부드러운 네온 레드 발광 효과 구현
                ctx.strokeStyle = `rgba(255, 65, 65, ${0.45 + Math.sin(Date.now() / 140) * 0.2})`;
                ctx.lineWidth = 3.5;
                ctx.shadowColor = '#ff4141';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(bX, bY, size + 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // 클릭 선택 표시기
            if (selectedObject && selectedObject.row === b.row && selectedObject.col === b.col) {
                ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
                ctx.strokeRect(bX - size - 4, bY - size - 4, size * 2 + 8, size * 2 + 8);
            }

            if (img && img.complete && img.width > 0) {
                ctx.drawImage(img, bX - size, bY - size, size * 2, size * 2);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
                let label = b.type === 'generator' ? `G${b.level}` : b.type === 'slow' ? `S${b.level}` : b.type === 'amp' ? `A${b.level}` : `T${b.level}`;
                if (b.subType !== 'none') label = b.subType.toUpperCase().substring(0,3);
                ctx.fillText(label, bX, bY + size + 8);
            } else {
                if (b.type === 'generator') { ctx.fillStyle = b.level >= 3 ? '#00ffcc' : '#10b981'; ctx.beginPath(); ctx.arc(bX, bY, size, 0, Math.PI*2); ctx.fill(); } 
                else if (b.type === 'slow') { ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(bX, bY - size); ctx.lineTo(bX + size, bY + size); ctx.lineTo(bX - size, bY + size); ctx.closePath(); ctx.fill(); } 
                else if (b.type === 'amp') { ctx.fillStyle = '#ff4141'; ctx.beginPath(); ctx.arc(bX, bY, size, 0, Math.PI*2); ctx.fill(); } 
                else if (b.type === 'turret') {
                    ctx.fillStyle = b.subType === 'none' ? '#f59e0b' : b.subType === 'multi' ? '#ffd700' : b.subType === 'fire' ? '#ef4444' : '#a855f7';
                    ctx.fillRect(bX - size, bY - size, size * 2, size * 2);
                }
            }
            if(b.level > 7) { ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1.2; ctx.strokeRect(bX - size - 2, bY - size - 2, size * 2 + 4, size * 2 + 4); }
        });

        for (let i = chainLines.length - 1; i >= 0; i--) {
            let l = chainLines[i]; ctx.save();
            ctx.strokeStyle = `rgba(168, 85, 247, ${l.alpha})`; ctx.lineWidth = 2.0; ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 6;
            ctx.beginPath(); ctx.moveTo(l.x1, l.y1);
            let cx = (l.x1 + l.x2)/2 + (Math.random()-0.5)*12; let cy = (l.y1 + l.y2)/2 + (Math.random()-0.5)*12;
            ctx.lineTo(cx, cy); ctx.lineTo(l.x2, l.y2); ctx.stroke(); ctx.restore();
            l.alpha -= 0.16; if (l.alpha <= 0) chainLines.splice(i, 1);
        }

        for (let i = zombies.length - 1; i >= 0; i--) {
            let z = zombies[i]; let speed = z.speed; if (z.slowTimer > 0) { z.slowTimer--; speed *= 0.45; }
            if (z.state === 'attack') {
                let targetX = Math.max(gate.x, Math.min(z.x, gate.x + gate.width)); let targetY = gate.y + gate.height;
                let isCollidingWithGate = (z.x >= gate.x - z.radius && z.x <= gate.x + gate.width + z.radius && z.y >= gate.y - z.radius && z.y <= gate.y + gate.height + z.radius);
                if (!isCollidingWithGate) { let angle = Math.atan2(targetY - z.y, targetX - z.x); z.x += Math.cos(angle) * speed; z.y += Math.sin(angle) * speed; } 
                else {
                    let now = Date.now();
                    if (now - z.lastAttack > 1000) {
                        let dmgDealt = z.type === 'boss' ? 300 : (z.type === 'runner' ? 25 : 55);
                        gate.hp -= dmgDealt; z.lastAttack = now;
                        createPopupText(z.x, gate.y + gate.height, `-💥${dmgDealt}`, '#ff3333', 12); createParticle(z.x, gate.y + gate.height, '#ff3333', 8);
                        if (gate.hp <= 0) { gameState.gameOver = true; endGame(); }
                    }
                }
            }
            z.animTimer++; if (z.animTimer >= 10) { z.animFrame = (z.animFrame + 1) % z.maxFrames; z.animTimer = 0; }
            let zImg = z.type === 'boss' ? gameImages.zombie_boss : (z.type === 'runner' ? gameImages.zombie_runner : gameImages.zombie_normal);

            if (zImg && zImg.complete && zImg.width > 0) {
                let cellW = 100; let cellH = 100; let sx = z.animFrame * cellW; let sy = 0;
                ctx.save(); ctx.translate(z.x, z.y);
                ctx.drawImage(zImg, sx, sy, cellW, cellH, -z.radius * 2, -z.radius * 2, z.radius * 4, z.radius * 4);
                ctx.restore();
            } else {
                ctx.fillStyle = z.type === 'boss' ? '#581c87' : (z.type === 'runner' ? '#ea580c' : '#166534');
                ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#333'; ctx.fillRect(z.x - 10, z.y - z.radius - 5, 20, 2.5);
            ctx.fillStyle = '#00ff00'; ctx.fillRect(z.x - 10, z.y - z.radius - 5, 20 * (z.hp / z.maxHp), 2.5);
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; if (!zombies.includes(b.target)) { bullets.splice(i, 1); continue; }
            let dx = b.target.x - b.x; let dy = b.target.y - b.y; let d = Math.hypot(dx, dy);
            if (d < b.target.radius) {
                b.target.hp -= b.damage; if (b.type === 'slow') b.target.slowTimer = 100;
                createParticle(b.target.x, b.target.y, b.type === 'fire' ? '#ef4444' : (b.type === 'slow' ? '#00ffff' : '#f59e0b'), 4);
                if (b.target.hp <= 0) {
                    let drop = b.target.type === 'boss' ? 60 : 3; gameState.gold += drop; gameState.waveZombiesLeft--;
                    createPopupText(b.target.x, b.target.y, `+💰${drop}`, '#ffd700', 11); playSoundFX('coin');
                    zombies.splice(zombies.indexOf(b.target), 1); updateUI();
                }
                bullets.splice(i, 1);
            } else { b.x += (dx/d)*b.speed; b.y += (dy/d)*b.speed; ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, Math.PI*2); ctx.fill(); }
        }

        for(let i=textPopups.length-1; i>=0; i--) { 
            let t = textPopups[i]; t.y += t.ySpeed; t.alpha -= 0.035; 
            if(t.alpha<=0) textPopups.splice(i,1); 
            else { ctx.save(); ctx.globalAlpha=t.alpha; ctx.fillStyle=t.color; ctx.font=`bold ${t.size}px sans-serif`; ctx.textAlign='center'; ctx.fillText(t.text,t.x,t.y); ctx.restore(); } 
        }
        for(let i=particles.length-1; i>=0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.04; if(p.alpha<=0) particles.splice(i,1); else { ctx.save(); ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2); ctx.fill(); ctx.restore(); } }

        if (!gameState.gameOver) requestAnimationFrame(gameLoop);
    }

    function endGame() { if (bgmInterval) clearTimeout(bgmInterval); playSoundFX('gameover'); document.getElementById('game-over-screen').style.display = 'flex'; document.getElementById('go-desc').innerText = `최종 단계: WAVE ${gameState.wave}`; }
    document.getElementById('restart-btn').addEventListener('click', () => location.reload());
    
    resizeCanvas(); updateUI(); requestAnimationFrame(gameLoop);
</script>
</body>
</html>
