<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>좀비 디펜스 - 굳건한 성문 (업그레이드판)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; touch-action: manipulation; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 500px; margin: 0 auto; background: #1a1a1a; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #top-ui { height: 60px; background: #222; border-bottom: 3px solid #333; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; font-size: 14px; font-weight: bold; z-index: 5; }
        .ui-stat { display: flex; align-items: center; gap: 5px; }
        .gold-text { color: #ffd700; }
        .elec-text { color: #00ffff; }
        .wave-text { color: #ff4d4d; }
        #canvas-container { flex: 1; position: relative; background: #181818; }
        canvas { width: 100%; height: 100%; display: block; }
        #bottom-ui { height: 110px; background: #222; border-top: 3px solid #333; display: flex; justify-content: space-around; align-items: center; padding: 10px; gap: 5px; z-index: 5; }
        .build-btn { flex: 1; height: 100%; background: #2b2b2b; border: 2px solid #444; border-radius: 8px; color: #fff; font-weight: bold; font-size: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; transition: all 0.1s; }
        .build-btn.active { border-color: #00ffff; background: #1e2e2e; transform: scale(1.03); }
        .cost-tag { font-size: 9px; color: #ffd700; }
        #upgrade-modal { display: none; position: absolute; bottom: 120px; left: 5%; width: 90%; background: rgba(25, 25, 25, 0.95); border: 2px solid #00ffff; border-radius: 10px; padding: 15px; z-index: 10; box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .modal-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #00ffff; display: flex; justify-content: space-between; }
        .modal-close { cursor: pointer; color: #ff4d4d; padding: 0 5px; }
        .modal-info { font-size: 12px; margin-bottom: 12px; line-height: 1.5; color: #ccc; }
        .modal-btn { width: 100%; padding: 10px; background: #00ffff; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 13px; cursor: pointer; }
        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #game-over-screen h1 { font-size: 36px; color: #ff4d4d; letter-spacing: 2px; }
        #restart-btn { padding: 12px 35px; font-size: 16px; background: #ff4d4d; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-ui">
        <div class="ui-stat">💰 <span id="gold-val" class="gold-text">400</span></div>
        <div class="ui-stat">⚡ <span id="elec-val" class="elec-text">0</span></div>
        <div class="ui-stat">☠️ <span id="wave-val" class="wave-text">WAVE 1</span></div>
        <div id="timer-val">00:00</div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="upgrade-modal">
            <div class="modal-title"><span id="m-title">건물 정보</span><span class="modal-close" id="m-close">✕</span></div>
            <div class="modal-info" id="m-info">상세 스펙 설명</div>
            <button class="modal-btn" id="m-upgrade-btn">업그레이드</button>
        </div>
    </div>

    <div id="bottom-ui">
        <button class="build-btn" id="btn-gate"><div>🚪 문 업그레이드</div><div class="cost-tag" id="cost-gate">💰120</div></button>
        <button class="build-btn" id="btn-generator"><div>⚡ 발전기</div><div class="cost-tag">💰50</div></button>
        <button class="build-btn" id="btn-turret"><div>🏹 기본타워</div><div class="cost-tag">💰60</div></button>
        <button class="build-btn" id="btn-slow"><div>❄️ 슬로우</div><div class="cost-tag" style="color:#00ffff">💰90 ⚡1</div></button>
        <button class="build-btn" id="btn-amp"><div>⚙️ 증폭타워</div><div class="cost-tag" style="color:#ff00ff">💰150 ⚡3</div></button>
    </div>

    <div id="game-over-screen">
        <h1>BASE DESTROYED</h1>
        <p id="go-desc" style="color: #aaa; font-size: 14px;"></p>
        <button id="restart-btn">다시 도전</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeCanvas() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let gameState = { gold: 400, electricity: 0, wave: 1, time: 0, gameOver: false };
    const GRID_ROWS = 6; const GRID_COLS = 5;
    let cellWidth = 0; let cellHeight = 0; let gridStartY = 0; let gridHeight = 0;
    let gateWidth = 130; // 집중 공격받을 중앙 문의 가로 크기

    function updateGridDimensions() {
        cellWidth = canvas.width / GRID_COLS;
        gridStartY = canvas.height * 0.45; // 타일 여백 축소를 위해 시작점을 아래로 내림
        gridHeight = canvas.height * 0.48; // 타일 공간 컴팩트화
        cellHeight = gridHeight / GRID_ROWS;
    }

    // 시각적 업그레이드가 반영되는 문 데이터
    let gate = { hp: 1000, maxHp: 1000, level: 1, regen: 4, upgradeCost: 120 };
    const gateStyles = [
        { color: '#8b5a2b', width: 6 },  // Lv.1: 나무/브론즈 느낌
        { color: '#a1a1a1', width: 9 },  // Lv.2: 실버/철문 느낌
        { color: '#d4af37', width: 12 }, // Lv.3: 골드/강화 합금 느낌
        { color: '#00e5ff', width: 16 }  // Lv.4+: 네온 에너지 실드 느낌
    ];

    let buildings = []; let zombies = []; let bullets = []; let particles = []; let textPopups = [];
    let currentBuildMode = 'none'; 
    let globalBuff = { damageMultiplier: 1.0, rangeBonus: 0 }; // 증폭 타워 버프치

    const goldVal = document.getElementById('gold-val');
    const elecVal = document.getElementById('elec-val');
    const waveVal = document.getElementById('wave-val');
    const timerVal = document.getElementById('timer-val');
    const upgradeModal = document.getElementById('upgrade-modal');

    // 문 강화 이벤트
    document.getElementById('btn-gate').addEventListener('click', () => {
        if (gameState.gold >= gate.upgradeCost) {
            gameState.gold -= gate.upgradeCost;
            gate.level++; gate.maxHp += 600; gate.hp = gate.maxHp; gate.regen += 3;
            gate.upgradeCost = Math.floor(gate.upgradeCost * 1.6);
            createParticle(canvas.width/2, gridStartY, '#00ffff', 25);
            updateUI();
        }
    });

    // 빌드 버튼들 등록
    const modes = ['generator', 'turret', 'slow', 'amp'];
    modes.forEach(mode => {
        document.getElementById(`btn-${mode === 'amp' ? 'amp' : mode}`).addEventListener('click', () => {
            setBuildMode(currentBuildMode === mode ? 'none' : mode);
        });
    });

    function setBuildMode(mode) {
        currentBuildMode = mode;
        modes.forEach(m => {
            document.getElementById(`btn-${m === 'amp' ? 'amp' : m}`).classList.toggle('active', currentBuildMode === m);
        });
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left; const y = e.clientY - rect.top;
        if (y >= gridStartY && y <= gridStartY + gridHeight) {
            const col = Math.floor(x / cellWidth); const row = Math.floor((y - gridStartY) / cellHeight);
            if (col >= 0 && col < GRID_COLS && row >= 0 && row < GRID_ROWS) handleGridClick(row, col);
        } else { upgradeModal.style.display = 'none'; }
    });

    function handleGridClick(row, col) {
        const existing = buildings.find(b => b.row === row && b.col === col);
        if (currentBuildMode !== 'none') {
            if (existing) return;
            let cost = 0; let elecCost = 0;
            if (currentBuildMode === 'generator') cost = 50;
            else if (currentBuildMode === 'turret') cost = 60;
            else if (currentBuildMode === 'slow') { cost = 90; elecCost = 1; }
            else if (currentBuildMode === 'amp') { cost = 150; elecCost = 3; }

            if (gameState.gold >= cost && gameState.electricity >= elecCost) {
                gameState.gold -= cost; gameState.electricity -= elecCost;
                buildings.push({ row, col, type: currentBuildMode, level: 1 });
                createParticle(col * cellWidth + cellWidth/2, gridStartY + row * cellHeight + cellHeight/2, '#ffffff', 12);
                setBuildMode('none');
                recalculateBuffs();
                updateUI();
            }
        } else if (existing) { showUpgradeModal(existing); }
    }

    // 증폭 타워 성능 실시간 갱신 계산 연산
    function recalculateBuffs() {
        let totalAmpLevels = 0;
        buildings.forEach(b => { if (b.type === 'amp') totalAmpLevels += b.level; });
        globalBuff.damageMultiplier = 1.0 + (totalAmpLevels * 0.25); // 레벨당 전 건물 데미지 25% 복리 증가
        globalBuff.rangeBonus = totalAmpLevels * 20; // 레벨당 사거리 +20px 증가
    }

    function showUpgradeModal(building) {
        upgradeModal.style.display = 'block';
        let cost = Math.floor(60 * Math.pow(1.6, building.level));
        if (building.type === 'amp') cost = Math.floor(120 * Math.pow(1.8, building.level));

        document.getElementById('m-title').innerText = `${building.type.toUpperCase()} (Lv.${building.level})`;
        
        let desc = "";
        if (building.type === 'generator') desc = `초당 골드 생산: +${building.level * 4}<br>Lv.3 달성 시 초당 전력(+1) 활성화`;
        else if (building.type === 'turret') desc = `기본 공격력 강화 (현재 증폭 버프 반영 중)`;
        else if (building.type === 'slow') desc = `냉기 투사체를 발사해 좀비 속도를 60% 차감 둔화`;
        else if (building.type === 'amp') desc = `【공학 증폭 타워】<br>업그레이드 시 기지 내 모든 공격 타워의 데미지 및 사정거리 영구 누적 상승!`;

        document.getElementById('m-info').innerHTML = desc;
        const upBtn = document.getElementById('m-upgrade-btn');
        upBtn.innerText = `업그레이드 (💰${cost})`;
        upBtn.onclick = () => {
            if (gameState.gold >= cost) {
                gameState.gold -= cost; building.level++; upgradeModal.style.display = 'none'; 
                recalculateBuffs(); updateUI();
            }
        };
    }
    document.getElementById('m-close').onclick = () => upgradeModal.style.display = 'none';

    function createParticle(x, y, color, count) {
        for(let i=0; i<count; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, radius: Math.random()*3+1, color, alpha: 1 });
        }
    }

    function createGoldText(x, y, amount, size) {
        textPopups.push({ x, y, text: `+💰${amount}`, alpha: 1, size, ySpeed: -1.2 });
    }

    function spawnZombie() {
        if (gameState.gameOver) return;
        let hpBase = 60 + gameState.wave * 30;
        let spawnX = canvas.width / 2 + (Math.random() - 0.5) * (gateWidth - 20); // 성문 가로 범위 안에서만 내려오도록 유도
        let rand = Math.random();

        if (gameState.time > 50 && rand < 0.12) {
            zombies.push({ x: canvas.width/2, y: -40, hp: hpBase*7, maxHp: hpBase*7, speed: 0.3, type: 'boss', radius: 22, state: 'attack', retreatTarget: 0, lastAttack: 0, slowTimer: 0 });
        } else if (rand > 0.75) {
            zombies.push({ x: spawnX, y: -20, hp: hpBase*0.6, maxHp: hpBase*0.6, speed: 1.5, type: 'runner', radius: 10, state: 'attack', retreatTarget: 0, lastAttack: 0, slowTimer: 0 });
        } else {
            zombies.push({ x: spawnX, y: -20, hp: hpBase, maxHp: hpBase, speed: 0.65, type: 'normal', radius: 13, state: 'attack', retreatTarget: 0, lastAttack: 0, slowTimer: 0 });
        }
    }

    function updateUI() {
        goldVal.innerText = Math.floor(gameState.gold);
        elecVal.innerText = Math.floor(gameState.electricity);
        waveVal.innerText = `WAVE ${gameState.wave}`;
        let min = Math.floor(gameState.time / 60); let sec = gameState.time % 60;
        timerVal.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        document.getElementById('cost-gate').innerText = `💰${gate.upgradeCost}`;
    }

    // 시간 및 자원 스케줄링 루프
    setInterval(() => {
        if (gameState.gameOver) return;
        gameState.time++; gameState.gold += 3;

        buildings.forEach(b => {
            if (b.type === 'generator') {
                gameState.gold += b.level * 4;
                if (b.level >= 3) gameState.electricity += 1;
            }
        });

        if (gate.hp < gate.maxHp) gate.hp = Math.min(gate.maxHp, gate.hp + gate.regen);
        if (gameState.time % 30 === 0) gameState.wave++;
        if (Math.random() < 0.45 + (gameState.wave * 0.07)) spawnZombie();
        updateUI();
    }, 1000);

    // 타워 공격 루프
    setInterval(() => {
        if (gameState.gameOver) return;
        buildings.forEach(b => {
            let tX = b.col * cellWidth + cellWidth/2; let tY = gridStartY + b.row * cellHeight + cellHeight/2;
            let target = null; let maxRange = (b.type === 'slow' ? 180 : 300) + globalBuff.rangeBonus;

            // 문 방향으로 내려오는 살아있는 좀비 타겟팅
            zombies.forEach(z => {
                let dist = Math.hypot(z.x - tX, z.y - tY);
                if (dist < maxRange && z.y < gridStartY - 10) { if(!target || z.y > target.y) target = z; }
            });

            if (target) {
                let baseDmg = b.type === 'turret' ? b.level * 24 : b.level * 6;
                let finalDmg = baseDmg * globalBuff.damageMultiplier;
                bullets.push({ x: tX, y: tY, target, speed: b.type === 'slow' ? 6 : 9, damage: finalDmg, type: b.type });
            }
        });
    }, 550);

    // 프레임 애니메이션 및 물리 통합 연산 루프
    function gameLoop() {
        updateGridDimensions();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let gateLeft = (canvas.width - gateWidth) / 2;
        let gateRight = gateLeft + gateWidth;

        // 1. 좌우 굳건한 외벽(성벽 영역) 시각화 및 내부 격자 테두리 제한
        ctx.fillStyle = '#2c2c2c';
        ctx.fillRect(0, gridStartY, gateLeft, gridHeight);
        ctx.fillRect(gateRight, gridStartY, canvas.width - gateRight, gridHeight);
        
        ctx.fillStyle = '#1f1f1f';
        ctx.fillRect(gateLeft, gridStartY, gateWidth, gridHeight); // 좀비가 통과하는 안마당 길목

        // 타일 그리드 선 스케일 압축 매핑
        ctx.strokeStyle = '#333333'; ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_COLS; i++) { 
            ctx.beginPath(); ctx.moveTo(i * cellWidth, gridStartY); ctx.lineTo(i * cellWidth, gridStartY + gridHeight); ctx.stroke(); 
        }
        for (let j = 0; j <= GRID_ROWS; j++) { 
            ctx.beginPath(); ctx.moveTo(0, gridStartY + j * cellHeight); ctx.lineTo(canvas.width, gridStartY + j * cellHeight); ctx.stroke(); 
        }

        // 2. 가시적으로 진화하는 중앙 성문(Gate) 디자인 그리기
        let currentStyle = gateStyles[Math.min(gate.level - 1, gateStyles.length - 1)];
        ctx.strokeStyle = currentStyle.color;
        ctx.lineWidth = currentStyle.width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(gateLeft, gridStartY - 5);
        ctx.lineTo(gateRight, gridStartY - 5);
        ctx.stroke();

        // 성벽 경계선
        ctx.fillStyle = '#555';
        ctx.fillRect(0, gridStartY - 10, gateLeft, 10);
        ctx.fillRect(gateRight, gridStartY - 10, canvas.width - gateRight, 10);

        // 체력바 인터페이스
        let hpPercent = gate.hp / gate.maxHp;
        ctx.fillStyle = '#444'; ctx.fillRect(gateLeft, gridStartY - 18, gateWidth, 4);
        ctx.fillStyle = currentStyle.color; ctx.fillRect(gateLeft, gridStartY - 18, gateWidth * hpPercent, 4);

        // 3. 빌딩 타워 코어 렌더링
        buildings.forEach(b => {
            let bX = b.col * cellWidth + cellWidth/2; let bY = gridStartY + b.row * cellHeight + cellHeight/2;
            let size = Math.min(cellWidth, cellHeight) * 0.38; // 타일 크기에 딱 맞춘 알맞은 규모

            if (b.type === 'generator') {
                ctx.fillStyle = b.level >= 3 ? '#00ffcc' : '#10b981'; ctx.beginPath(); ctx.arc(bX, bY, size, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`⚡G${b.level}`, bX, bY+4);
            } else if (b.type === 'turret') {
                ctx.fillStyle = '#f59e0b'; ctx.fillRect(bX - size, bY - size, size * 2, size * 2);
                ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`🏹T${b.level}`, bX, bY+4);
            } else if (b.type === 'slow') {
                ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(bX, bY - size); ctx.lineTo(bX + size, bY + size); ctx.lineTo(bX - size, bY + size); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`❄️S${b.level}`, bX, bY+7);
            } else if (b.type === 'amp') {
                // 공학 증폭 기어형 사각형 구조 원형 믹스
                ctx.fillStyle = '#ec4899'; ctx.beginPath(); ctx.arc(bX, bY, size, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`⚙️AMP${b.level}`, bX, bY+3);
            }
        });

        // 4. 좀비 인공지능 후퇴 및 체력 회복 메커니즘 엔진 작동
        for (let i = zombies.length - 1; i >= 0; i--) {
            let z = zombies[i];
            let currentSpeed = z.speed;
            if (z.slowTimer > 0) { z.slowTimer--; currentSpeed *= 0.4; }

            // AI 상태 머신 제어
            if (z.state === 'attack') {
                // 체력이 35% 이하로 떨어지면 뚝 떨어지며 도망 시도 (보스는 자존심상 도망치지 않음)
                if (z.hp / z.maxHp <= 0.35 && z.type !== 'boss') {
                    z.state = 'retreat';
                    z.retreatTarget = z.y - (60 + Math.random() * 60); // 안전지대 후퇴 거리 설정
                }
                
                if (z.y < gridStartY - 10) { z.y += currentSpeed; } 
                else {
                    let now = Date.now();
                    if (now - z.lastAttack > 1000) {
                        let dmg = z.type === 'boss' ? 150 : (z.type === 'runner' ? 15 : 30);
                        gate.hp -= dmg; z.lastAttack = now;
                        createParticle(z.x, gridStartY - 5, '#ff3333', 10);
                        if (gate.hp <= 0) { gameState.gameOver = true; endGame(); }
                    }
                }
            } else if (z.state === 'retreat') {
                // 위(안전지대)로 후퇴 동작 실행 및 도망치며 힐 축적
                z.y -= currentSpeed * 1.2;
                z.hp = Math.min(z.maxHp, z.hp + (z.type === 'runner' ? 0.4 : 0.25)); // 도망치며 실시간 자가 힐 회복

                // 힐 이펙트 파티클 생략 노출
                if (Math.random() < 0.15) createParticle(z.x, z.y, '#22c55e', 1);

                // 목표한 도망 지점까지 갔거나 체력이 90% 이상 완치되면 재진격
                if (z.y <= z.retreatTarget || z.hp / z.maxHp >= 0.9 || z.y <= 10) {
                    z.state = 'attack';
                }
            }

            // 좀비 렌더링
            ctx.fillStyle = z.state === 'retreat' ? '#22c55e' : (z.type === 'boss' ? '#581c87' : (z.type === 'runner' ? '#ea580c' : '#166534'));
            ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2); ctx.fill();
            
            // 미니 체력바 표시
            ctx.fillStyle = '#ff4d4d'; ctx.fillRect(z.x - 12, z.y - z.radius - 6, 24, 3);
            ctx.fillStyle = '#00ff00'; ctx.fillRect(z.x - 12, z.y - z.radius - 6, 24 * (z.hp / z.maxHp), 3);
            if (z.slowTimer > 0) { ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.stroke(); }
        }

        // 5. 투사체 미사일 및 차등 골드 드롭 판정 처리
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (!zombies.includes(b.target)) { bullets.splice(i, 1); continue; }

            let dx = b.target.x - b.x; let dy = b.target.y - b.y; let dist = Math.hypot(dx, dy);

            if (dist < b.target.radius) {
                b.target.hp -= b.damage;
                if (b.type === 'slow') b.target.slowTimer = 110;
                createParticle(b.target.x, b.target.y, b.type === 'slow' ? '#00ffff' : '#f59e0b', 4);

                if (b.target.hp <= 0) {
                    // 등급에 따른 차등 보상 지급 연출 기획 적용
                    let dropGold = 20; let pCount = 6; let pSize = 12;
                    if (b.target.type === 'runner') { dropGold = 35; pCount = 10; pSize = 14; }
                    else if (b.target.type === 'boss') { dropGold = 400; pCount = 35; pSize = 22; }

                    gameState.gold += dropGold;
                    createGoldText(b.target.x, b.target.y, dropGold, pSize);
                    createParticle(b.target.x, b.target.y, '#ffd700', pCount);
                    
                    zombies.splice(zombies.indexOf(b.target), 1);
                    updateUI();
                }
                bullets.splice(i, 1);
            } else {
                b.x += (dx / dist) * b.speed; b.y += (dy / dist) * b.speed;
                ctx.fillStyle = b.type === 'slow' ? '#00ffff' : '#f59e0b';
                ctx.beginPath(); ctx.arc(b.x, b.y, b.type === 'slow' ? 5 : 3.5, 0, Math.PI*2); ctx.fill();
            }
        }

        // 6. 골드 텍스트 오버레이 팝업 애니메이션 렌더러
        for (let i = textPopups.length - 1; i >= 0; i--) {
            let t = textPopups[i]; t.y += t.ySpeed; t.alpha -= 0.025;
            if (t.alpha <= 0) { textPopups.splice(i, 1); } 
            else {
                ctx.save(); ctx.globalAlpha = t.alpha;
                ctx.fillStyle = '#ffd700'; ctx.font = `bold ${t.size}px sans-serif`; ctx.textAlign = 'center';
                ctx.fillText(t.text, t.x, t.y); ctx.restore();
            }
        }

        // 7. 폭발 파티클 루프
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
            if (p.alpha <= 0) { particles.splice(i, 1); } 
            else {
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore();
            }
        }

        if (!gameState.gameOver) requestAnimationFrame(gameLoop);
    }

    function endGame() {
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('go-desc').innerText = `버틴 시간: ${timerVal.innerText} | 도달한 최대 웨이브: WAVE ${gameState.wave}`;
    }

    document.getElementById('restart-btn').addEventListener('click', () => location.reload());
    updateUI();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
